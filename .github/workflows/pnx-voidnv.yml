name: PNX VoidNV validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'PNX-port/VoidNV/**'
      - '.github/workflows/pnx-voidnv.yml'
      - 'PowerNukkitX-beta.zip'
permissions:
  contents: write
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile API from the user's PNX source archive
        run: |
          set -euo pipefail
          unzip -q PowerNukkitX-beta.zip -d "$RUNNER_TEMP/pnx"
          cd "$RUNNER_TEMP/pnx/PowerNukkitX-beta"
          chmod +x gradlew
          ./gradlew --no-daemon shadowJar -x test -x generateGitProperties
          test -f build/powernukkitx.jar
      - name: Compile VoidNV and run pure logic tests
        run: |
          set -euo pipefail
          src=PNX-port/VoidNV
          mkdir -p "$RUNNER_TEMP/pnx-plugin/classes" "$RUNNER_TEMP/pnx-plugin/test"
          javac --release 25 -encoding UTF-8 -cp "$RUNNER_TEMP/pnx/PowerNukkitX-beta/build/powernukkitx.jar" -d "$RUNNER_TEMP/pnx-plugin/classes" $(find "$src/src/main/java" -name '*.java' -print)
          javac --release 25 -encoding UTF-8 -cp "$RUNNER_TEMP/pnx-plugin/classes" -d "$RUNNER_TEMP/pnx-plugin/test" $(find "$src/src/test/java" -name '*.java' -print)
          java -cp "$RUNNER_TEMP/pnx-plugin/classes:$RUNNER_TEMP/pnx-plugin/test" ru.voidpe.pnx.nv.HelpersTest
          cp -r "$src/src/main/resources/." "$RUNNER_TEMP/pnx-plugin/classes/"
          jar --create --file "$RUNNER_TEMP/pnx-plugin/VoidNV-1.0.0-pnx.1.jar" -C "$RUNNER_TEMP/pnx-plugin/classes" .
          jar --list --file "$RUNNER_TEMP/pnx-plugin/VoidNV-1.0.0-pnx.1.jar" | grep -Fx plugin.yml
      - name: Smoke test on isolated PNX server
        run: python3 PNX-port/VoidNV/tools/smoke.py
      - name: Save smoke-test diagnostics for troubleshooting
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pnx-voidnv-server/stdout.log"
          if [ ! -f "$log" ]; then exit 0; fi
          tail -c 30000 "$log" > "$RUNNER_TEMP/pnx-smoke-diagnostics.txt"
          branch='arena/41da8305-geyserplugins'
          git fetch origin "$branch"
          parent=$(git rev-parse "refs/remotes/origin/$branch")
          idx="$RUNNER_TEMP/pnx-diagnostic-index"
          rm -f "$idx"
          export GIT_INDEX_FILE="$idx"
          git read-tree "$parent"
          blob=$(git hash-object -w "$RUNNER_TEMP/pnx-smoke-diagnostics.txt")
          git update-index --add --cacheinfo 100644,"$blob",.ci-diagnostics/pnx-voidnv.txt
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='PNX CI' GIT_AUTHOR_EMAIL='ci@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(printf 'Save PNX smoke-test diagnostics\n' | git commit-tree "$tree" -p "$parent")
          git push origin "$commit:refs/heads/$branch"
      - name: Save test build (not yet approved for live use)
        uses: actions/upload-artifact@v4
        with:
          name: VoidNV-PNX-test-build
          path: ${{ runner.temp }}/pnx-plugin/VoidNV-1.0.0-pnx.1.jar
          if-no-files-found: error
