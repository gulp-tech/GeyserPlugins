name: Build FaralTab + ResourcePack

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 (под Purpur 26.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Подобрать актуальный билд Purpur API 26.2
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import re, urllib.request
          url = "https://repo.purpurmc.org/snapshots/org/purpurmc/purpur/purpur-api/maven-metadata.xml"
          try:
              xml = urllib.request.urlopen(url, timeout=30).read().decode()
              versions = re.findall(r"<version>(26\.2\.build\.(\d+)-stable)</version>", xml)
              if versions:
                  best = max(versions, key=lambda v: int(v[1]))[0]
                  print(f"PURPUR_VERSION={best}")
              else:
                  print("PURPUR_VERSION=26.2.build.2632-stable")
          except Exception as e:
              print(f"# metadata недоступна ({e}), используем значение по умолчанию", file=__import__("sys").stderr)
              print("PURPUR_VERSION=26.2.build.2632-stable")
          PY
          echo "Purpur API: $PURPUR_VERSION"

      - name: Проверить и собрать Geyser extension VoidCommands
        working-directory: VoidCommandsExtension
        run: |
          mkdir -p "$RUNNER_TEMP/voidcommands-tests"
          javac -d "$RUNNER_TEMP/voidcommands-tests" src/main/java/ru/voidpe/geyser/commands/SuggestionText.java src/selfTest/java/ru/voidpe/geyser/commands/SuggestionTextTest.java
          java -ea -cp "$RUNNER_TEMP/voidcommands-tests" ru.voidpe.geyser.commands.SuggestionTextTest
          set +e
          ./gradlew --no-daemon clean build > gradle.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E "FAILURE|What went wrong|Execution failed|error:|Could not|Caused by|Exception" gradle.log | head -100 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
            tail -50 gradle.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
            exit "$code"
          fi
          if jar tf build/libs/VoidCommandsExtension-1.0.0.jar | grep -q '^org/bukkit/'; then
            echo "::error::Compile-only Bukkit stubs must not be packaged"
            exit 1
          fi

      - name: Проверить и собрать VoidPvP
        working-directory: VoidPvP
        run: |
          mkdir -p /tmp/voidpvp-test
          javac -d /tmp/voidpvp-test src/main/java/ru/voidpe/pvp/AttackSpeedCheck.java src/main/java/ru/voidpe/pvp/MaceDamageCheck.java src/test/java/ru/voidpe/pvp/AttackSpeedCheckTest.java src/test/java/ru/voidpe/pvp/MaceDamageCheckTest.java || { echo "::error::VoidPvP regression test compilation failed"; exit 1; }
          java -ea -cp /tmp/voidpvp-test ru.voidpe.pvp.AttackSpeedCheckTest || { echo "::error::VoidPvP regression test failed"; exit 1; }
          java -ea -cp /tmp/voidpvp-test ru.voidpe.pvp.MaceDamageCheckTest || { echo "::error::VoidPvP mace regression test failed"; exit 1; }
          build() { mvn -B -DskipTests "$@" package > mvn.log 2>&1; }
          if ! build -Dpurpur.version="$PURPUR_VERSION"; then
            grep -E "\[ERROR\]|BUILD FAILURE|Could not resolve|Failed to read" mvn.log | head -20 | sed 's/%/%25/g; s/^/::warning::/' || true
            if ! build -Dapi.groupId=io.papermc.paper -Dapi.artifactId=paper-api -Dpurpur.version=26.2-R0.1-SNAPSHOT; then
              grep -E "\[ERROR\]|BUILD FAILURE|Could not resolve|Failed to read" mvn.log | head -25 | sed 's/%/%25/g; s/^/::error::/' || true
              cat mvn.log
              exit 1
            fi
          fi

      - name: Собрать плагин VoidTab
        working-directory: VoidTab
        run: |
          build() { mvn -B -DskipTests "$@" package > mvn.log 2>&1; }
          if ! build -Dpurpur.version="$PURPUR_VERSION"; then
            grep -E "\[ERROR\]|BUILD FAILURE|Could not resolve|Failed to read" mvn.log | head -20 | sed 's/%/%25/g; s/^/::error::/'
            echo "Purpur API недоступна — собираем с Paper API (на Purpur работает так же)"
            if ! build -Dapi.groupId=io.papermc.paper -Dapi.artifactId=paper-api -Dpurpur.version=26.2-R0.1-SNAPSHOT; then
              grep -E "\[ERROR\]|BUILD FAILURE|Could not resolve|Failed to read" mvn.log | head -20 | sed 's/%/%25/g; s/^/::error::/'
