              exit 1
            fi
          fi

      - name: Собрать Geyser extension VoidAnvil
        working-directory: VoidAnvilExtension
        run: |
          set +e
          ./gradlew --no-daemon clean build > gradle.log 2>&1
          code=$?
          cat gradle.log
          if [ "$code" -ne 0 ]; then
            grep -E "FAILURE|What went wrong|Execution failed|error:|Could not|Caused by|Exception" gradle.log | head -40 | sed 's/%/%25/g; s/
/%0D/g; s/\n/%0A/g; s/^/::error::/'
            tail -30 gradle.log | sed 's/%/%25/g; s/
/%0D/g; s/\n/%0A/g; s/^/::error::/'
            exit "$code"
          fi

      - name: Собрать Bedrock ресурспак (.mcpack)
        run: python3 tools/build_mcpack.py

      - name: Артефакты (плагин + пак)
        uses: actions/upload-artifact@v4
        with:
          name: VoidPE-release
          path: |
            VoidTab/target/VoidTab-*.jar
            VoidTalismans/target/VoidTalismans-*.jar
            VoidCases/target/VoidCases-*.jar
            VoidClans/target/VoidClans-*.jar
            VoidDrops/target/VoidDrops-*.jar
            VoidCombat/target/VoidCombat-*.jar
            VoidAnvilExtension/build/libs/VoidAnvilExtension-*.jar
            VoidResourcePack.mcpack
