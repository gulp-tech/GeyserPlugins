name: Build FaralTab + ResourcePack

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 (под Purpur 26.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Собрать плагин FaralTab
        working-directory: FaralTab
        run: mvn -B -DskipTests package

      - name: Собрать Bedrock ресурспак (.mcpack)
        run: python3 tools/build_mcpack.py

      - name: Артефакты (плагин + пак)
        uses: actions/upload-artifact@v4
        with:
          name: FaralMC-release
          path: |
            FaralTab/target/FaralTab-*.jar
            FaralResourcePack.mcpack
