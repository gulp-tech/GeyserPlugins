name: GeyserJavaGlowing maintenance build
on:
  push:
    branches: ['arena/41da8305-geyserplugins']
    paths: ['GeyserJavaGlowing/**', '.github/workflows/geyser-glowing.yml']
    tags: ['glowing-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run regression tests
        working-directory: GeyserJavaGlowing
        run: |
          set +e
          bash gradlew --no-daemon clean test jar > gradle.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E 'FAILURE|What went wrong|Execution failed|error:|Could not|Caused by|Exception|FAILED' gradle.log | head -100 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
            tail -100 gradle.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
            for f in build/test-results/test/TEST-*.xml; do
              [ -f "$f" ] && grep -E -A8 '<failure|<error' "$f" | head -80 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
            done
            exit "$code"
          fi
          tail -20 gradle.log
      - name: Verify optimized pack inside JAR
        working-directory: GeyserJavaGlowing
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          jar = pathlib.Path('build/libs/GeyserJavaGlowing-0.2.13-voidpe.2.jar')
          with zipfile.ZipFile(jar) as z:
              pack = z.read('GeyserJavaGlowing.mcpack')
              assert hashlib.sha256(pack).hexdigest() == 'eea9f0ff1bdef2f8098a224b567b11d4a7fd43f775503975478a9d31e2bd5ff7'
              pathlib.Path('build/verified.mcpack').write_bytes(pack)
              assert z.testzip() is None
          PY
      - name: Verify pack against original
        working-directory: GeyserJavaGlowing
        run: python3 tools/pack_tool.py test build/verified.mcpack
      - uses: actions/upload-artifact@v4
        with:
          name: GeyserJavaGlowing-voidpe
          path: GeyserJavaGlowing/build/libs/GeyserJavaGlowing-0.2.13-voidpe.2.jar
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/glowing-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" GeyserJavaGlowing/build/libs/GeyserJavaGlowing-0.2.13-voidpe.2.jar --target "$GITHUB_SHA" --title "GeyserJavaGlowing VoidPE 0.2.13-2 (experimental FPS)" --notes "Experimental Bedrock FPS build. Checks glow status before armor queries without changing geometry or features. Improvement and visual compatibility require Bedrock testing."
