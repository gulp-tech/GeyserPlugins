name: VoidGifts loot menu tests
on:
  push:
    branches: ['arena/41da8305-geyserplugins']
    paths: ['VoidGifts/**', '.github/workflows/voidgifts-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Select Purpur API
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import re, urllib.request
          try:
              data=urllib.request.urlopen('https://repo.purpurmc.org/snapshots/org/purpurmc/purpur/purpur-api/maven-metadata.xml',timeout=30).read().decode()
              versions=re.findall(r'<version>(26\.2\.build\.(\d+)-stable)</version>',data)
              print('PURPUR_VERSION='+ (max(versions,key=lambda x:int(x[1]))[0] if versions else '26.2.build.2632-stable'))
          except Exception:
              print('PURPUR_VERSION=26.2.build.2632-stable')
          PY
      - name: Compile and run loot menu tests
        working-directory: VoidGifts
        run: |
          set +e
          mvn -B -Dpurpur.version="$PURPUR_VERSION" clean test > test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E '\[ERROR\]|FAILURE|Exception|Failures:|Errors:' test.log | head -100 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
            for f in target/surefire-reports/*.txt; do
              [ -f "$f" ] && head -90 "$f" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/'
            done
            exit "$code"
          fi
          tail -30 test.log
