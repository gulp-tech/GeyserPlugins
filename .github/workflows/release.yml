      - name: Проверить защитные конфиги HyperTNT
        run: |
          python3 -m venv "$RUNNER_TEMP/tnt-venv"
          "$RUNNER_TEMP/tnt-venv/bin/pip" install PyYAML
          "$RUNNER_TEMP/tnt-venv/bin/python" tools/test_hypertnt_configs.py

      - name: Собрать плагин VoidShulker
        working-directory: VoidShulker
        run: |
          mkdir -p "$RUNNER_TEMP/voidshulker-tests"
          javac -d "$RUNNER_TEMP/voidshulker-tests" src/main/java/ru/voidpe/shulker/StackTransfer.java src/test/java/ru/voidpe/shulker/StackTransferTest.java
          java -ea -cp "$RUNNER_TEMP/voidshulker-tests" ru.voidpe.shulker.StackTransferTest
          mvn -B -Dpurpur.version="$PURPUR_VERSION" test > "$RUNNER_TEMP/shulker-mock-tests.log" 2>&1 || { grep -E 'ERROR|FAILURE|Tests run:' "$RUNNER_TEMP/shulker-mock-tests.log" | head -40 | sed 's/%/%25/g; s/^/::error::/' || true; cat "$RUNNER_TEMP/shulker-mock-tests.log"; exit 1; }
