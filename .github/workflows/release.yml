name: Release (плагин и пак отдельными файлами)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25 (под Purpur 26.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Подобрать актуальный билд Purpur API 26.2
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import re, sys, urllib.request
          url = "https://repo.purpurmc.org/snapshots/org/purpurmc/purpur/purpur-api/maven-metadata.xml"
          try:
              xml = urllib.request.urlopen(url, timeout=30).read().decode()
              versions = re.findall(r"<version>(26\.2\.build\.(\d+)-stable)</version>", xml)
              print(f"PURPUR_VERSION={max(versions, key=lambda v: int(v[1]))[0] if versions else '26.2.build.2632-stable'}")
          except Exception as e:
              print(f"# metadata недоступна: {e}", file=sys.stderr)
              print("PURPUR_VERSION=26.2.build.2632-stable")
          PY

      - name: Собрать плагин FaralTab
        working-directory: FaralTab
        run: |
          build() { mvn -B -DskipTests "$@" package > mvn.log 2>&1; }
          if ! build -Dpurpur.version="$PURPUR_VERSION"; then
            grep -E "\[ERROR\]|BUILD FAILURE|Could not resolve|Failed to read" mvn.log | head -20 | sed 's/%/%25/g; s/^/::error::/'
            echo "Purpur API недоступна — собираем с Paper API (на Purpur работает так же)"
            if ! build -Dapi.groupId=io.papermc.paper -Dapi.artifactId=paper-api -Dpurpur.version=26.2-R0.1-SNAPSHOT; then
              grep -E "\[ERROR\]|BUILD FAILURE|Could not resolve|Failed to read" mvn.log | head -20 | sed 's/%/%25/g; s/^/::error::/'
              exit 1
            fi
          fi

      - name: Собрать плагин FaralTalismans
        working-directory: FaralTalismans
        run: |
          build() { mvn -B -DskipTests "$@" package > mvn.log 2>&1; }
          if ! build -Dpurpur.version="$PURPUR_VERSION"; then
            grep -E "\[ERROR\]|BUILD FAILURE|Could not resolve|Failed to read" mvn.log | head -20 | sed 's/%/%25/g; s/^/::error::/'
            echo "Purpur API недоступна — собираем с Paper API (на Purpur работает так же)"
            if ! build -Dapi.groupId=io.papermc.paper -Dapi.artifactId=paper-api -Dpurpur.version=26.2-R0.1-SNAPSHOT; then
              grep -E "\[ERROR\]|BUILD FAILURE|Could not resolve|Failed to read" mvn.log | head -20 | sed 's/%/%25/g; s/^/::error::/'
              exit 1
            fi
          fi

      - name: Собрать Bedrock ресурспак (.mcpack)
        run: python3 tools/build_mcpack.py

      - name: Опубликовать релиз с отдельными файлами
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls FaralTab/target/FaralTab-*.jar | head -1)
          TAL=$(ls FaralTalismans/target/FaralTalismans-*.jar | head -1)
          echo "Файлы релиза: $JAR + $TAL + FaralResourcePack.mcpack"
          gh release create "${{ inputs.tag || github.ref_name }}" "$JAR" "$TAL" FaralResourcePack.mcpack \
            --target "$GITHUB_SHA" \
            --title "FaralMC ${{ inputs.tag || github.ref_name }} — FaralTab + ресурспак" \
            --notes "Bedrock-only сервер FaralMC (Purpur 26.2 + Geyser + Floodgate).

          **FaralTab-1.1.0.jar** — плагин скорборда в \`plugins/\` (нужны Vault, PlayerPoints, LuckPerms, Geyser, Floodgate).
          **FaralResourcePack.mcpack** — Bedrock-ресурспак с иконками в \`plugins/Geyser-Spigot/packs/\` + \`force-resource-packs: true\` в конфиге Geyser.

          Java-игроки кикаются плагином (bedrock-only), Java-заглушек нет."
