      - name: Опубликовать релиз с отдельными файлами
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PVP=$(ls VoidPvP/target/VoidPvP-*.jar | head -1)
          JAR=$(ls VoidTab/target/VoidTab-*.jar | head -1)
          TAL=$(ls VoidTalismans/target/VoidTalismans-*.jar | head -1)
          ITM=$(ls VoidItems/target/VoidItems-*.jar | head -1)
          ENC=$(ls VoidEnchants/target/VoidEnchants-*.jar | head -1)
          CAS=$(ls VoidCases/target/VoidCases-*.jar | head -1)
          CLN=$(ls VoidClans/target/VoidClans-*.jar | head -1)
          DRP=$(ls VoidDrops/target/VoidDrops-*.jar | head -1)
          CMB=$(ls VoidCombat/target/VoidCombat-*.jar | head -1)
          VAC=$(ls VoidAntiCheat/target/VoidAntiCheat-*.jar | head -1)
          AUS=$(ls VoidAuthSpawn/target/VoidAuthSpawn-*.jar | head -1)
          WCT=$(ls VoidWardenCity/target/VoidWardenCity-*.jar | head -1)
          RTZ=$(ls VoidRtpZone/target/VoidRtpZone-*.jar | head -1)
          NV=$(ls VoidNV/target/VoidNV-*.jar | head -1)
          SHU=$(ls VoidShulker/target/VoidShulker-*.jar | head -1)
          ANV=$(ls VoidAnvilExtension/build/libs/VoidAnvilExtension-*.jar | head -1)
          VVE=$(ls VoidVersionsExtension/build/libs/VoidVersionsExtension-*.jar | head -1)
          python3 tools/package_hypertnt_configs.py "$RUNNER_TEMP/VoidPE-HyperTNT-safe-configs.zip"
          echo "Файлы релиза: $JAR + $TAL + $ITM (ресурспак убран: он вызывал лаги)"
          gh release create "${{ inputs.tag || github.ref_name }}" "$PVP" "$JAR" "$TAL" "$ITM" "$ENC" "$CAS" "$CLN" "$DRP" "$CMB" "$VAC" "$AUS" "$WCT" "$RTZ" "$NV" "$SHU" "$ANV" "$VVE" VoidSpheres.mcpack "$RUNNER_TEMP/VoidPE-HyperTNT-safe-configs.zip" \
            --target "$GITHUB_SHA" \
            --title "VoidPE ${{ inputs.tag || github.ref_name }}" \
            --notes "VoidWardenCity 1.4.3: городские сундуки больше нельзя застраивать, ломать или уносить; lock-building=true по умолчанию защищает весь город даже со старым config.yml. Админский обход и обычное открытие сундуков сохранены. VoidShulker 1.0.4: свободное размещение в любом слоте через курсор, ПКМ, Shift-click, drag и цифровые клавиши. VoidPvP 1.0.9: ослабление прямого удара MACE на 5, минимум 0. Проверьте всё на копии сервера до установки. VoidSpheres.mcpack — только для сфер."
