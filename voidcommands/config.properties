# VoidCommandsExtension — настоящие Bukkit tab-completion для Bedrock
enabled=true
# Сколько аргументов каждой ветки команды обогащать (1 = только первый).
max-depth=4
# Общий предохранитель от слишком большого AvailableCommandsPacket.
max-targets=1024
# Максимум значений в одном per-player soft enum.
max-suggestions=100
# Сколько tab-complete запросов выполнять на основном потоке за тик.
params-per-tick=8
# Повтор после выполнения команды: /sethome, /delhome, /warp и т.д.
refresh-after-command-ticks=2
# Фоновое обновление внешних изменений; 0 = выключить.
periodic-refresh-ticks=6000
verbose=false
