# ============================================================
#  FaralItems — кастомные предметы как на FunTime (FaralMC, Bedrock)
#
#  Предметы: трапка, явная пыль, дезориентация, лом спавнеров,
#  особые зелья (сила 3 / скорость 3 и т.д.). Всё настраивается:
#  названия, материалы, лор, радиусы, время, кулдауны, эффекты,
#  рецепты крафта, тексты. Предмет узнаётся по скрытой метке —
#  переименованием не подделать.
#
#  ПОЛУЧЕНИЕ: админ — /items (клик в меню выдаёт), игроки — крафты,
#  если у предмета recipe.enabled: true.
#  Цвета как везде: &a, &#FFB340, <gradient:#..:#..>текст</gradient>
# ============================================================

menu:
  title: "&#C86BFFКастомные предметы"
  rows: 2   # слотов хватает на все предметы (9 в ряд)

# ------------------------------------------------------------
#  ЗАПРЕТНЫЕ ЗОНЫ: тут кастомные предметы НЕ работают (зелья — можно).
#  worlds: миры целиком. worldguard-regions: имена регионов WorldGuard,
#  например регион спавна. Нужен плагин WorldGuard; без него работают
#  только миры.
# ------------------------------------------------------------
banned:
  worlds: []
  worldguard-regions: []

messages:
  prefix: "&#C86BFFFaralMC &8» &f"
  no-permission: "&cТолько для админов."
  received: "&aВыдан предмет: {item}"
  banned: "&cЗдесь этот предмет запрещён."
  cooldown: "&cПодожди ещё &f{seconds} сек. &c({item}&c)"
  trap-used: "&aТрапка поставлена!"
  no-target: "&7Рядом никого нет."
  trapped-you: "&#FF6B6BТы в трапке игрока {player}!"
  trap-ended: "&7Трапка рассыпалась."
  trap-unbreakable: "&cТрапку нельзя сломать."
  trap-no-place: "&cВ трапке нельзя ставить блоки."
  dust-used: "&aЯвная пыль сработала."
  revealed-you: "&#FFE082Тебя раскрыла явная пыль!"
  disorient-used: "&aДезориентация сработала."
  lom-used: "&aСпавнер добыт (моб: &f{mob}&a), лом потрачен."

# ------------------------------------------------------------
#  ПРЕДМЕТЫ. kind — что предмет делает:
#    TRAP — трапка: ПКМ ловит ближайшего игрока клеткой 3x3
#    DUST — явная пыль: свечение + снять невидимость в радиусе
#    DISORIENT — дезориентация: эффекты + разворот экрана врагам
#    LOM — лом спавнеров: сломать спавнер и забрать с мобом (1 раз)
#    POTION — зелье: эффекты из списка effects (уровень = amplifier+1)
#  recipe: крафт на верстаке напрямую: shape — 3 строки, ingredients — символы.
# ------------------------------------------------------------
items:

  trapka:
    kind: TRAP
    enabled: true
    display-name: "&#B388FFТрапка"
    material: NETHERITE_SCRAP
    glow: true
    lore:
      - "&7ПКМ: трапка появляется там,"                     
      - "&7где ты стоишь. Клетка 3×3, внутри пусто."
    duration-seconds: 20   # сколько держится клетка
    cooldown-seconds: 45
    sound: "block.crying_obsidian.place"
    # Скин клетки (красиво и по-игровому):
    blocks:
      floor: POLISHED_BLACKSTONE
      walls: CRYING_OBSIDIAN
      corners: GILDED_BLACKSTONE
      ceiling: POLISHED_BLACKSTONE
      light: SEA_LANTERN   # светильник в потолке по центру
    recipe:
      enabled: true
      shape:
        - "OCO"
        - "CEC"
        - "OCO"
      ingredients: {O: OBSIDIAN, C: CRYING_OBSIDIAN, E: ENDER_EYE}

  dust:
    kind: DUST
    enabled: true
    display-name: "&#FFE082Явная пыль"
    material: GLOWSTONE_DUST
    glow: true
    lore:
      - "&7ПКМ: все игроки в радиусе светятся"
      - "&7и теряют невидимость."
    radius: 15
    glowing-seconds: 10
    marker-text: "&f&l▼"   # белая метка над подсвеченным (видна сквозь блоки)
    cooldown-seconds: 30
    sound: "entity.firework_rocket.launch"
    recipe:
      enabled: true
      shape:
        - "GSG"
        - "SDS"
        - "GSG"
      ingredients: {G: GLOWSTONE_DUST, S: SUGAR, D: GLOW_INK_SAC}

  dezorientation:
    kind: DISORIENT
    enabled: true
    display-name: "&#8CE8FFДезориентация"
    material: ENDER_EYE
    glow: true
    lore:
      - "&7ПКМ: враги в радиусе получают:"
      - "&cСлепота 2 сек, Тошнота 5 сек,"
      - "&cЗамедление III 4 сек + разворот экрана."
    radius: 9
    cooldown-seconds: 45
    rotate-view: 1         # 1 — разворачивать экран врагам, 0 — нет
    sound: "entity.wither.ambient"
    effects:
      - {type: BLINDNESS, amplifier: 0, duration: 2}
      - {type: NAUSEA, amplifier: 0, duration: 5}
      - {type: SLOWNESS, amplifier: 2, duration: 4}
    recipe:
      enabled: true
      shape:
        - "FEF"
        - "EDE"
        - "FEF"
      ingredients: {F: FERMENTED_SPIDER_EYE, E: ENDER_PEARL, D: DIAMOND}

  spawner_lom:
    kind: LOM
    enabled: true
    display-name: "&#FFB340Лом спавнеров"
    material: GOLDEN_PICKAXE
    glow: false
    lore:
      - "&7Сломай ей спавнер — заберёшь его"
      - "&7вместе с мобом. Кирка одноразовая."
    spawner-item-name: "&#FFB340Спавнер &7({mob})"
    recipe:
      enabled: true
      shape:
        - "III"
        - " S "
        - " S "
      ingredients: {I: GOLD_INGOT, S: STICK}

  # ---------------- Зелья (работают и в запретных зонах) ----------------
  # amplifier: 0 = уровень I, 2 = уровень III. duration — секунды.

  pot_berserk:
    kind: POTION
    enabled: true
    display-name: "&#FF5555Зелье берсерка"
    material: POTION
    glow: true
    lore: ["&7Сила III + Скорость III"]
    color: "#FF3D3D"
    effects:
      - {type: STRENGTH, amplifier: 2, duration: 180}
      - {type: SPEED, amplifier: 2, duration: 180}
    recipe:
      enabled: true
      shape: ["NSN", "SBS", "NSN"]
      ingredients: {N: NETHER_WART, S: BLAZE_POWDER, B: GLASS_BOTTLE}

  pot_warrior:
    kind: POTION
    enabled: true
    display-name: "&#FF9A3DЗелье воина"
    material: POTION
    glow: true
    lore: ["&7Сила II + Скорость I"]
    color: "#FF9A3D"
    effects:
      - {type: STRENGTH, amplifier: 1, duration: 180}
      - {type: SPEED, amplifier: 0, duration: 180}
    recipe:
      enabled: true
      shape: ["N N", "SBS", "N N"]
      ingredients: {N: NETHER_WART, S: SUGAR, B: GLASS_BOTTLE}

  pot_runner:
    kind: POTION
    enabled: true
    display-name: "&#55E6FFЗелье бегуна"
    material: POTION
    glow: true
    lore: ["&7Скорость III + Прыгучесть II"]
    color: "#55E6FF"
    effects:
      - {type: SPEED, amplifier: 2, duration: 180}
      - {type: JUMP_BOOST, amplifier: 1, duration: 180}
    recipe:
      enabled: true
      shape: ["F F", "SBS", "F F"]
      ingredients: {F: FEATHER, S: SUGAR, B: GLASS_BOTTLE}

  pot_tank:
    kind: POTION
    enabled: true
    display-name: "&#8FB8FFЗелье танка"
    material: POTION
    glow: true
    lore: ["&7Сопротивление II + Огнестойкость"]
    color: "#8FB8FF"
    effects:
      - {type: RESISTANCE, amplifier: 1, duration: 180}
      - {type: FIRE_RESISTANCE, amplifier: 0, duration: 180}
    recipe:
      enabled: true
      shape: ["O O", "MBM", "O O"]
      ingredients: {O: OBSIDIAN, M: MAGMA_CREAM, B: GLASS_BOTTLE}

    # --- Пример своего предмета-зелья (убери # и правь) ---
