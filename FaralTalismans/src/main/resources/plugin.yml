name: FaralTalismans
version: '${project.version}'
main: ru.FaralMC.talismans.FaralTalismans
api-version: '26.2'
author: FaralMC
description: Талисманы — плюсы и минусы к характеристикам, пока предмет в левой руке. Всё настраивается в config.yml.
commands:
  talisman:
    description: "Меню талисманов (только админы): клик по талисману выдаёт его"
    usage: /talisman
    aliases: [tal, талисман]
permissions:
  faraltalismans.admin:
    description: Команда /talisman и выдача талисманов из меню
    default: op
  faraltalismans.menu:
    description: Открывать меню талисманов
    default: true
