# ============================================================
#  FaralTalismans — талисманы как на FunTime (FaralMC, Bedrock-only)
#
#  Как работает: талисман лежит в нужном слоте — игрок получает его
#  эффекты и атрибуты. Убрал — через пару секунд всё пропало.
#  Талисман опознаётся по скрытой метке в предмете (PDC), а не по
#  названию, поэтому переименовать/подделать его нельзя.
#
#  ВСЁ ниже настраивается: хоть все 6 талисманов перепиши под себя,
#  можно менять названия, материалы, лор, эффекты, силу, рецепты.
#  Цвета как везде у нас: &a, &#FFB340, <gradient:#..:#..>текст</gradient>
#
#  Эффекты (type): STRENGTH, SPEED, HASTE, REGENERATION, RESISTANCE,
#    FIRE_RESISTANCE, HEALTH_BOOST, JUMP_BOOST, NIGHT_VISION, SATURATION и т.д.
#    amplifier: 0 = уровень I, 1 = уровень II...
#  Атрибуты (type): max_health, movement_speed, attack_damage,
#    armor, knockback_resistance... operation: ADD_NUMBER | ADD_SCALAR | MULTIPLY_SCALAR_1
# ============================================================

settings:
  # Как часто проверять инвентари, в тиках (20 = 1 сек). Эффект живёт ещё ~5 сек после проверки.
  refresh-interval-ticks: 40
  # Частицы эффектов талисманов (на Bedrock их почти не видно, по умолчанию выкл).
  effect-particles: false
  # Показывать активные талисманы в экшенбаре над хотбаром.
  show-actionbar: false
  # Максимум одновременно активных талисманов (0 = без лимита).
  max-active-talismans: 0

menu:
  title: "&#C86BFFТалисманы FaralMC"
  rows: 3
  status-active: "&aАктивен"
  status-inactive: "&7Не активен (талисмана нет в нужном слоте)"

messages:
  prefix: "&#C86BFFFaralMC &8» &f"
  reloaded: "&aКонфиг перезагружен."
  no-permission: "&cУ вас нет прав на эту команду."
  player-not-found: "&cИгрок не найден."
  not-found: "&cТакого талисмана нет. Список: &f/talisman list"
  given: "&aТалисман выдан игроку {player}"
  received: "&aВы получили талисман! Откройте &f/talismans"

# ------------------------------------------------------------
#  САМИ ТАЛИСМАНЫ. Ключ (strength, speed...) — это id для /talisman give.
#  where: INVENTORY — anywhere в инвентаре | HOTBAR — только хотбар | OFFHAND — только вторая рука
#  permission: "" — всем | "faraltalismans.vip" — только с этим правом (выдаётся в LuckPerms)
#  recipe: крафт на верстаке. shape — 3 строки по 3 символа, ingredients — что значит каждый символ.
# ------------------------------------------------------------
