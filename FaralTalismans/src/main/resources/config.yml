# ============================================================
#  FaralTalismans — талисманы как на FunTime (FaralMC, Bedrock-only)
#
#  КАК ЭТО РАБОТАЕТ НА FUNTIME (и здесь так же):
#  Талисман — обычный предмет. Пока он лежит в инвентаре, игрок
#  получает его ПЛЮСЫ и МИНУСЫ к характеристикам: урон, броню,
#  твёрдость брони, здоровье, скорость, скорость атаки.
#  Убрал талисман — через пару секунд бонусы пропали.
#  На FunTime талисманы покупают за валюту (ТК) — здесь за монеты
#  Vault: клик по талисману в меню /talismans или /talisman buy <id>.
#
#  КАСТОМИЗАЦИЯ: настраивается АБСОЛЮТНО всё — названия, иконки
#  (material), лор, плюсы/минусы и их числа, цены, место ношения,
#  права, рецепты крафта, все тексты, цвета и звуки.
#  Можно: отключить талисман (enabled: false), изменить любой,
#  добавить свой — просто скопируй блок и дай новый id.
#  После правок: /talisman reload (старый config.yml НЕ перезапишется
#  сам — либо правь файл на сервере, либо удали его перед обновлением).
#
#  Цвета: &a, &#FFB340, <gradient:#55C8FF:#1B6FFF>текст</gradient>
#  В лоре работают подстановки: {stats} — автолор характеристик,
#  {price} — цена. Талисман опознаётся по скрытой метке в предмете,
#  переименованием его не подделать.
# ============================================================

settings:
  # Как часто проверять инвентари, в тиках (20 = 1 сек).
  refresh-interval-ticks: 40
  # Максимум одновременно активных талисманов у игрока (0 = без лимита, как на FunTime).
  max-active-talismans: 0
  # Сами дописывать характеристики в лор, если в лоре нет {stats}.
  auto-stats-lore: true
  # Цвета плюсов и минусов в авто-лоре.
  stat-plus-color: "&a"
  stat-minus-color: "&c"
  # Название валюты в ценах (на FunTime это ТК).
  currency-name: "монет"
  # Сообщать игроку, что талисман включился/выключился.
  notify-on-change: true
  # Звуки включения/выключения ("" = выкл). Имена звуков Minecraft, напр. entity.player.levelup
  sound-activated: "entity.player.levelup"
  sound-deactivated: "block.note_block.bass"
  # Частицы potion-эффектов талисманов (на Bedrock почти не видны).
  effect-particles: false
  # Показывать активные талисманы строкой над хотбаром.
  show-actionbar: false

# Названия характеристик в авто-лоре {stats}. Ключи атрибутов Minecraft:
# attack_damage, armor, armor_toughness, max_health, movement_speed,
# attack_speed, knockback_resistance, luck, jump_strength...
stat-names:
  attack_damage: "к урону"
  armor: "к броне"
  armor_toughness: "к твёрдости брони"
  max_health: "к максимальному здоровью"
  movement_speed: "к скорости"
  attack_speed: "к скорости атаки"
  knockback_resistance: "к сопротивлению отбрасыванию"
  luck: "к удаче"
  jump_strength: "к силе прыжка"

# Названия potion-эффектов в авто-лоре (если талисману дашь effects).
effect-names:
  strength: "Сила"
  speed: "Скорость"
  haste: "Спешка"
  regeneration: "Регенерация"
  resistance: "Сопротивление"
  fire_resistance: "Огнестойкость"
  health_boost: "Прилив здоровья"
  jump_boost: "Прыгучесть"
  night_vision: "Ночное зрение"
  saturation: "Сытость"

menu:
  title: "&#C86BFFТалисманы FaralMC"
  rows: 4
  # Клик по талисману в меню покупает его за монеты (как магазин на FunTime).
  click-to-buy: true
  status-active: "&aАктивен"
  status-inactive: "&7Не активен (талисмана нет в нужном месте)"

messages:
  prefix: "&#C86BFFFaralMC &8» &f"
  reloaded: "&aКонфиг перезагружен."
  no-permission: "&cУ вас нет прав на эту команду."
  player-not-found: "&cИгрок не найден."
  not-found: "&cТакого талисмана нет. Список: &f/talisman list"
  given: "&aТалисман выдан игроку {player}"
  received: "&aВы получили талисман! Откройте &f/talismans"
  bought: "&aВы купили {talisman} &aза &f{price}"
  not-for-sale: "&7Этот талисман не продаётся."
  no-economy: "&cПокупка недоступна: на сервере нет экономики Vault."
  not-enough-money: "&cНе хватает монет на {talisman}&c: нужно &f{price}&c, у вас &f{balance}"
  activated: "&aТалисман включён: {talisman}"
  deactivated: "&7Талисман выключен: {talisman}"

# ------------------------------------------------------------
#  САМИ ТАЛИСМАНЫ (состав и цифры — как на FunTime, всё меняется!)
#
#  id (crusher, cobra...) — для /talisman give и /talisman buy.
#  enabled: false — выключить талисман, не удаляя из конфига.
#  where: INVENTORY — anywhere в инвентаре (как на FunTime) |
#         HOTBAR — только горячая панель | OFFHAND — вторая рука.
#  permission: "" — всем | "faraltalismans.vip" — только с правом.
#  price: цена покупки за монеты Vault (0 = не продаётся).
#  attributes: type — атрибут (см. stat-names выше), amount — число
#    (для operation ADD_SCALAR/MULTIPLY_SCALAR_1 это ДОЛИ: 0.15 = +15%),
#    operation: ADD_NUMBER — прибавить число | ADD_SCALAR — прибавить %.
#    Здоровье считается в HP: +2 = одно сердечко.
#  effects: необязательно: - {type: STRENGTH, amplifier: 0} (0 = уровень I).
#  recipe: крафт на верстаке (на FunTime талисманы не крафтят — выкл по умолчанию).
# ------------------------------------------------------------
