name: VoidCases
version: '${project.version}'
main: ru.voidpe.cases.VoidCases
api-version: '26.2'
author: VoidPE
description: "Донат-кейсы: титулы (LuckPerms) и осколки (PlayerPoints). Анимация-рулетка и объявления о выигрыше. Всё настраивается в config.yml."
softdepend: [LuckPerms, PlayerPoints]
commands:
  cases:
    description: "Кейсы: /cases give <игрок> <кейс> [кол-во] | /cases set <кейс> | /cases remove | /cases list | /cases reload"
    usage: /cases
    aliases: [case, кейсы]
permissions:
  voidcases.admin:
    description: Выдача кейсов и перезагрузка VoidCases
    default: op
