# ============================================================
#  VoidTab — скорборд (таб) сервера VoidPE
#  Purpur 26.2 + Geyser + Floodgate
#
#  Цвета: &a, &#FFB340 (hex), <gradient:#FF7A00:#FFFFFF>Текст</gradient>
#  Плейсхолдеры плагина:
#    {player} {group} {group_raw} {coins} {coins_raw} {shards}
#    {kills} {deaths} {kd} {online} {max} {ping}
#    {playtime_hours} {playtime_minutes} {playtime} {world}
#  Устройство игрока: {device} — название платформы (Windows/Android/iOS/...).
#  Иконки-глифы УБРАНЫ вместе с ресурспаком (пак вызывал лаги), поэтому {icon:...}
#  больше нет в строках по умолчанию. Нужны свои символы — впиши их в icons ниже
#  и добавь {icon:имя} в строку.
#  {device_icon}, {device} и {ping} плагин берёт НАПРЯМУЮ из ядра Purpurbedrock
#  (BedrockPlaceholderHook, без Floodgate и PlaceholderAPI): устройство — по
#  device_id (windows/android/ios/xbox/ps4_5/phone_kbm), пинг — реальный RakNet RTT.
#  Для любых других плагинов ядро даёт плейсхолдеры PlaceholderAPI (%...%):
#    %purpurbedrock_device% %purpurbedrock_device_id% %purpurbedrock_os%
#    %purpurbedrock_input% %purpurbedrock_device_model% %purpurbedrock_version%
#    %purpurbedrock_ping% %purpurbedrock_ping_colored% %purpurbedrock_is_phone_kbm%
#    %purpurbedrock_is_bedrock%
#  Плюс любые %плейсхолдеры% PlaceholderAPI (если включён ниже).
# ============================================================

# СЕРВЕР ТОЛЬКО ДЛЯ BEDROCK (ядро Purpurbedrock). Java-игроков плагин кикает — см. bedrock-only ниже.
# Ресурспак сервера убран полностью: он давал сильные лаги при появлении игроков.

# Только Bedrock: игрок без Floodgate (т.е. зашёл с Java напрямую мимо Geyser) будет кикнут.
bedrock-only:
  enabled: true
  # Кикать, только если плагин Floodgate реально стоит на сервере (иначе Bedrock от Java не отличить).
  # Если Floodgate нет — никто не кикается, в консоль один раз пишется предупреждение.
  kick-message: |
    &cVoidPE — сервер только для Bedrock!
    &7Заходи с телефона/планшета/Windows через Geyser.

# Большой заголовок при входе: синий VoidPE на весь экран (как логотип на фото).
# Показывается после загрузки мира, время — в тиках (20 = 1 сек).
join-title:
  enabled: true
  title: "&b&lVoidPE"   # просто &-коды: &b — синий, &l — жирный (градиент жирность в Bedrock не даёт)
  subtitle: "&fДобро пожаловать, &#FFA63D{player}&f!"
  fade-in-ticks: 10
  stay-ticks: 70
  fade-out-ticks: 20

# Как часто обновлять скорборд, в тиках (20 тиков = 1 сек). 40 = раз в 2 сек.
update-interval-ticks: 40

# LuckPerms — единый источник префикса/титула. Перед каждым обновлением
# VoidTab сбрасывает кэш метаданных LP и принудительно пересылает Bedrock
# display/list name, поэтому смена префикса видна без перезахода игрока.
# Ручное обновление одного игрока: /voidtab refresh <ник>
luckperms:
  refresh-cache: true
  # Как часто (сек) обновлять кэш префиксов LuckPerms по всем игрокам.
  refresh-cache-seconds: 10
  force-name-resend: true
  # Как часто (сек) принудительно пересылать display/list name, если ничего не изменилось.
  # Реальные изменения префикса/титула пересылаются сразу. 0 — только при изменениях (рекомендуется).
  # Было 60: каждую минуту всем игрокам заново уходили имена, и КАЖДЫЙ клиент заново
  # перерисовывал все неймтеги разом — это давало периодические фризы в толпе.
  force-name-resend-interval-seconds: 0
  # Кэш группы/префикса/титула LuckPerms на игрока, сек. Меньше — быстрее применяется
  # смена привилегии, больше — меньше обращений к LuckPerms (рефлексия) в цикле.
  cache-seconds: 5

performance:
  # Кэш анализа устройства, сек: устройство игрока определяется не чаще этого
  # интервала (анализ — рефлексия в ядро, на каждый рендер ника его делать нельзя).
  device-cache-seconds: 30
  # Сколько игроков обновлять за один проход цикла (цикл идёт каждые 2 тика,
  # работа распределена по тикам, а не вся в одном). 0 — авто под update-interval-ticks.
  batch-size: 0
  # Лёгкие неймтеги: над головой только значок устройства, без иконки и названия
  # привилегии — заметно легче для слабых телефонов в толпе. В TAB всё как обычно.
  light-nametags: false
  # Задержка (тики) перед обновлением ника/скорборда после телепорта: НЕ в тик
  # появления — в этот момент клиенты впервые рисуют игрока (скин+модель), и
  # лишние пакеты сверху дают фриз. Ник подтянется на долю секунды позже.
  appearance-delay-ticks: 5
  # Сколько появившихся игроков (вход/телепорт) обрабатывать за один тик.
  # 1 — максимально гладко; больше — ник появляется быстрее при массовых варпах.
  appearance-per-tick: 1
  # Кэш пинга для скорборда, сек (пинг запрашивается у ядра рефлексией).
  ping-cache-seconds: 2

# Задержка перед первым показом после захода, в тиках (дать Floodgate/Geyser прогрузиться).
join-delay-ticks: 20

scoreboard:
  enabled: true
  # Запоминать игроков, скрывших скорборд командой /voidtab toggle (файл hidden.yml).
  remember-hidden: true

  # Заголовок скорборда — обычный текст (картинка-логотип была в ресурспаке,
  # пак убран). Формат: &-коды, &#RRGGBB, <gradient:#RRGGBB:#RRGGBB>.
  title: "<gradient:#55C8FF:#1B6FFF>VoidPE</gradient>"

  # Строки скорборда (макс. 15). Пустая строка "" — отступ, как на фото.
  lines:
    - "&fИмя: &#FFA63D{player}"
    - "&fДонат: {group}"
    - "&fТитул: {title}"
    - "&fМонеты: &#FFD93D{coins}"
    - "&fОсколки: &#54C8FF{shards}"
    - ""
    - "&fПинг: &#7CFC00%purpurbedrock_ping%&f мс"
    - "&fВерсия: &#FFA63D%purpurbedrock_version%"
    - "&fУ/С: &#C86BFF{kills}&f/&#FF6B6B{deaths}"
    - "&fВ игре: &#FFD93D{playtime_hours}ч"

# ------------------------------------------------------------
# Иконки в скорборде ({icon:имя}) и в нике ({group_icon}).
# РЕСУРСПАК УБРАН, поэтому глифов больше нет: секция пустая, а {icon:...}
# в строке даёт пустую строку. Значок привилегии над головой теперь — обычный
# текст из LuckPerms, устройство показано словом в TAB.
# Нужны свои символы — впиши любой символ/эмодзи и добавь {icon:имя} в строку:
#   coin: "★"
icons: {}
# ------------------------------------------------------------
# Ник над головой: [привилегия] Ник + здоровье снизу.
# Работает через скорборд-команды: префикс — в команде ника, здоровье —
# objective below-name. Если игрок в невидимости (invisibility), ник и здоровье
# не видны — это поведение самой игры.
# Ресурспак убран, поэтому значков-картинок здесь больше нет: привилегия
# показывается её текстовым префиксом из LuckPerms.
nametag:
  enabled: true
  # Значки привилегии/устройства перед ником берутся из секции icons выше.
  # Пока icons пустая — значков нет, остаётся текстовый префикс привилегии.
  # Впишешь в icons (например strannik: "★") — значок появится сам.
  rank-icon: true
  # Название привилегии текстом перед ником (префикс LuckPerms).
  rank-name: true
  # Значок устройства перед ником: код иконки — icons.<device> (windows/android/...).
  # Пусто в icons — ничего не подставляется, устройство видно в TAB словом.
  device-icon: true
  prefix-color: "&f" # цвет ника после префикса
  # Для Bedrock (Geyser): дублировать значок в display-name игрока — оттуда Geyser
  # берёт неймтег над головой. Не выключай, если значка над головой не видно.
  use-display-name: true
  # Команды скорборда для неймтегов — ИМЕННО ОНИ рисуют оформление над головой
  # [значок устройства] [привилегия] Ник на Bedrock. Не выключай: без них ник
  # остаётся пустым/без значков.
  # true  — оформление работает (по умолчанию);
  # false — только ради эксперимента (над головой пропадёт значок и привилегия).
  # Тяжесть этого режима снята иначе: команды создаются только для игроков ТОГО
  # ЖЕ мира, новый борд наполняется до назначения (один пакет), а принудительная
  # пересылка имён выключена. См. /voidtab perf.
  use-teams: true
  # В TAB-списке после ника писать устройство текстом: MUSD38 (Windows) — понятно и без иконок.
  device-name-in-tab: true
  title-in-tab: true      # титул (кейс титулов) после ника в TAB
  # Красное сердечко после числа здоровья под ником (само число ставит игра).
  health-below-name: true
  health-suffix: "&c❤"
  # Если у конкретного игрока устройство определилось неправильно (клиент может
  # врать), задай вручную: ник: windows | android | apple | device | kbmouse.
  # Пример:  MUSD38: windows
  device-overrides: {}
  device-names:
    windows: "Windows"
    android: "Android"
    apple: "iOS"
    mac: "Mac OS"
    amazon: "Amazon Fire"
    xbox: "Xbox"
    playstation: "PlayStation"
    switch: "Nintendo Switch"
    vr: "VR"
    tv: "TV"
    controller: "Геймпад"
    kbmouse: "Клавиатура+мышь"
    device: "Устройство"

# ------------------------------------------------------------
# Привилегия ({group}). Сначала ищется здесь по имени группы LuckPerms/Vault,
# иначе — display-name группы LuckPerms (если включено ниже), иначе имя группы с большой буквы.
groups:
  # Префикс из LuckPerms (lp ... meta setprefix) — главный: поменял в LP,
  # поменялось в чате, скорборде и нике над головой. false — брать display ниже.
  use-luckperms-prefix: true
  use-luckperms-display-name: false

  default:
    display: '&#CFCFCFИгрок'
  strannik:
    display: '&#CFCFCFСтранник'
  geroy:
    display: '&#55FF55Герой'
  rycar:
    display: '&#FFFF55Рыцарь'
  baron:
    display: '&#FFAA00Барон'
  lord:
    display: '&#55FFFFЛорд'
  knyaz:
    display: '&#FF55FFКнязь'
  imperator:
    display: '<gradient:#FFD93D:#AA00AA>Император</gradient>'
  youtuber:
    display: '&#FF5555Ютубер'
  tiktoker:
    display: '&#55E6FFТиктокер'
  kurator:
    display: '&#C86BFFКуратор'
  stazher:
    display: '&#FFD166Стажёр'
  helper:
    display: '&#55FF55Хелпер'
  moderator:
    display: '&#5B8CFFМодератор'
  sozdatel:
    display: '&#FF5555Создатель'
  owner:
    display: "<gradient:#FF6A00:#FFD93D>Владелец</gradient>"

# ------------------------------------------------------------
# Монеты — баланс Vault Economy. Осколки — PlayerPoints (look).
coins:
  decimals: 0          # знаков после запятой
  grouping: true       # 1 000 000 вместо 1000000
  use-vault-format: false # true — формат самого Vault (с названием валюты, обычно длиннее)
shards:
  grouping: true
numbers:
  grouping-separator: " "

# Значения, если Vault/PlayerPoints не установлены.
defaults:
  coins: "0"
  shards: "0"

# Время в игре: {playtime} собирается из шаблона, {h} — часы, {m} — минуты.
playtime:
  format: "{h}ч {m}м"

hooks:
  placeholderapi: true # обрабатывать %...% плейсхолдеры в строках

messages:
  prefix: "&#FFB340VoidPE &8» &f"
  reloaded: "&aКонфиг перезагружен."
  refreshed: "&aПрефикс, скорборд, TAB и ник обновлены."
  no-permission: "&cУ вас нет прав на эту команду."
  player-not-found: "&cИгрок не найден."
  shown: "&aСкорборд включён."
  hidden: "&eСкорборд скрыт. Включить: &f/voidtab on"
