# LMtops - Configuration
# Author: musd348

font:
  enabled: false
  apply-to-titles: false
  apply-to-lore: false

# Автосохранение данных и сессий в минутах.
auto-save-interval: 5
# Число аккаунтов, обрабатываемых за тик (Vault вызывается только на главном потоке).
players-per-tick: 25
cache-update-interval: 300
top-limit: 10
kill-farm-interval-seconds: 60

currency:
  balance-symbol: $
  kills-name: убийств
  deaths-name: смертей
  shards-name: осколков
  blocks-name: блоков

gui:
  main-title: '&#FFD700✦ Топы Сервера ✦'
  balance-title: '&#FFD700⭐ Топ по Балансу'
  kills-title: '&#FF4444⚔ Топ по Убийствам'
  deaths-title: '&#777777☠ Топ по Смертям'
  shards-title: '&#AA55FF💎 Топ по Осколкам'
  blocks-title: '&#55CCFF⛏ Топ по Блокам'
  playtime-title: '&#FFAA00⏰ Топ по Времени'

sounds:
  open-menu: true
messages:
  prefix: '&#FFD700&lLMtops &8» '
  no-permission: '&#FF5555У вас нет прав!'
  player-only: '&#FF5555Только для игроков!'
  config-reloaded: '&#55FF55Конфигурация перезагружена!'
  holograms-updated: '&#55FF55Голограммы обновлены!'
  hologram-created: '&#55FF55Голограмма &#FFFFFF{id} &#55FF55создана!'
  hologram-deleted: '&#55FF55Голограмма &#FFFFFF{id} &#55FF55удалена!'
  hologram-not-found: '&#FF5555Голограмма &#FFFFFF{id} &#FF5555не найдена!'
  empty-placeholder: Пусто
  empty-value: '0'

holograms:
  enabled: true
  update-interval: 300
  # Прозрачность фона (0 = полностью прозрачный, 255 = полностью непрозрачный)
  background-alpha: 30
  # Режим по умолчанию для голограмм:
  # FIXED       - стоит на месте, не поворачивается вообще
  # CENTER      - крутится за игроком по всем осям
  # VERTICAL    - крутится только по горизонтали (не наклоняется)
  # HORIZONTAL  - крутится только по вертикали
  default-billboard: FIXED

  top_balance:
    enabled: true
    world: world
    x: 56.5
    y: 65.5
    z: -8.5
    type: balance
    # Можно задать индивидуально для каждой голограммы (FIXED / CENTER / VERTICAL / HORIZONTAL)
    billboard: FIXED
    lines:
      - '&#FFD700&l✦ ТОП ПО БАЛАНСУ ✦'
      - '&#AAAAAA▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬'
