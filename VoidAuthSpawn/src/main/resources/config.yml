# ============================================================
#  VoidAuthSpawn — дополнение к AuthMe (сервер VoidPE, Bedrock)
#
#  Когда зашедшему игроку ещё нужно РЕГИСТРИРОВАТЬСЯ в AuthMe
#  (у него нет аккаунта), плагин телепортирует его в точку ниже.
#  Зарегистрированных и вошедших игроков плагин не трогает.
#
#  Точку удобнее всего поставить командой, встав на нужное место:
#      /authspawn set
#  Цвета: &a, &#FFB340 и <gradient:#FF5555:#FFB340>текст</gradient>
# ============================================================

enabled: true

# Точка, куда телепортировать игрока для регистрации.
# Заполняется командой /authspawn set, но можно вписать и руками.
spawn:
  world: world
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  # Если мира из world: нет — взять спавн первого мира (true)
  # или вообще не телепортировать (false).
  fallback-to-world-spawn: true

teleport:
  # Телепортировать игроков, которым надо регистрироваться
  # (нет аккаунта в AuthMe). Это главное назначение плагина.
  unregistered: true
  # Телепортировать также зарегистрированных, но ещё НЕ вошедших
  # (/login не введён). false — трогаем только регистрацию.
  not-logged-in: false
  # Через сколько тиков после входа делать первую проверку
  # (20 тиков = 1 секунда). Задержка нужна, чтобы AuthMe успел
  # обработать вход, а наш телепорт сработал последним.
  check-delay-ticks: 20
  # Сколько раз повторять проверку (вдруг AuthMe или сам AuthMe
  # телепортировал игрока после нас — вернём его к точке).
  check-times: 3
  # Пауза между повторными проверками, в тиках.
  check-interval-ticks: 40
  # Звук при телепорте (пустая строка — без звука).
  play-sound: true
  sound: "minecraft:entity.enderman.teleport"

# Удержание у точки: пока игрок не зарегистрировался, не давать
# ему уходить дальше radius блоков от точки регистрации.
hold:
  enabled: false
  radius: 3.0

messages:
  prefix: "&#FFB340VoidPE &8» &f"
  # Сообщение при телепорте к точке регистрации.
  teleported: "&eСначала зарегистрируйтесь: &f/register <пароль> <пароль>"
  # Когда удержание вернуло игрока к точке.
  hold-back: "&cЗарегистрируйтесь, чтобы играть: &f/register <пароль> <пароль>"
  point-set: "&aТочка регистрации сохранена: &f{world} {x} {y} {z}"
  point-missing: "&cТочка регистрации не настроена: мир из конфига не найден."
  teleported-self: "&aВы телепортированы к точке регистрации."
  reloaded: "&aVoidAuthSpawn перезагружен."
  no-permission: "&cТолько для админов."
  players-only: "&cКоманда доступна только игроку."
  help:
    - "&fVoidAuthSpawn — точка регистрации AuthMe:"
    - "&7/authspawn set &8— поставить точку регистрации на своё место (админ)"
    - "&7/authspawn tp &8— телепортироваться к точке (проверка, админ)"
    - "&7/authspawn reload &8— перезагрузить конфиг (админ)"
