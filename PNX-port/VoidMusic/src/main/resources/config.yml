# VoidMusic: музыка для игроков в мире спавна.
# Пока игрок находится в указанном мире, ему играет трек;
# после прослушивания — пауза (по умолчанию 5 минут), потом трек снова.
# При выходе из мира звук глушится, при входе — запускается заново.

# Имя мира (спавн). Например: world, world_nether, spawn и т.д.
world: world

# Имя звука. Менять только вместе с VoidMusicPack.mcpack.
sound: 'voidpe:spawn_music'

# Громкость (0.0-1.0) и питч.
volume: 1.0
pitch: 1.0

# Длительность трека в секундах (2:52).
track-seconds: 172

# Пауза после трека: через сколько секунд он начнётся заново (5 минут).
pause-seconds: 300

# Команды:
#   /vmusic start [игрок] — начать музыку (админы)
#   /vmusic stop [игрок]  — прекратить (для себя — все игроки)
#   /vmusic status        — состояние (админы)
#   /vmusic reload        — перезагрузка конфига (админы)
