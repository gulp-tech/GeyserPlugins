# ============================================================
#  VoidAntiCheat — античит VoidPE ТОЛЬКО для Bedrock (Geyser/Floodgate)
#
#  Почему не обычный Java-античит: большинство Java-античитов Bedrock
#  либо игнорируют, либо ложно штрафуют из-за другой физики/ввода.
#  VoidAntiCheat проверяет именно Floodgate-игроков, работает через
#  Bukkit-события Purpur (без PacketEvents/ProtocolLib), держит на игрока
#  только маленькие примитивные буферы и не сканирует мир каждый тик.
#
#  ВАЖНО: первые дни после установки смотри алерты. Автокик включён
#  только на высоких VL, автобана по умолчанию НЕТ. Если какая-то
#  кастомная механика плагинов даёт скорость/рывки — добавь мир/регион
#  в исключения ниже или подними max-vl конкретной проверки.
# ============================================================

settings:
  enabled: true
  # Проверять только Bedrock/Floodgate. На этом сервере Java запрещена,
  # поэтому при недоступном Floodgate ниже есть безопасный fallback.
  bedrock-only: true
  # Если Floodgate API не нашлась: true = проверять всех (сервер Bedrock-only),
  # false = никого не проверять до установки Floodgate.
  check-all-if-floodgate-missing: true
  # Не проверять в этих мирах и регионах WorldGuard (арены с кастомной
  # физикой, мини-игры, катсцены, плагины с рывками и т.п.).
  excluded-worlds: []
  excluded-worldguard-regions: []
  # Ниже этого TPS проверки движения не штрафуют: сервер сам отстаёт.
  min-tps-for-movement: 16.0
  # Грейсы после входа/телепорта/респавна/нокбэка, миллисекунды.
  join-grace-ms: 3500
  teleport-grace-ms: 1750
  respawn-grace-ms: 3500
  world-change-grace-ms: 2500
  velocity-grace-ms: 900
  # Алерты персоналу: кулдаун одинаковых алертов по игроку+проверке.
  alert-cooldown-ms: 2500
  alert-min-vl: 1.0
  log-console: true
  log-file: true
  staff-alerts: true
  # Повторное наказание одному игроку по одной проверке не чаще, чем раз в N сек.
  punish-cooldown-seconds: 60
  setback-cooldown-ms: 900
  debug: false

# Команды наказания. Выполняются от консоли при punish-vl проверки.
# Плейсхолдеры: %player%, %check%, %vl%, %max_vl%, %details%, %ping%, %tps%, %world%
# По умолчанию только кик на высоком VL. Бан добавь сам, когда будешь уверен.
punishments:
  commands:
    - "kick %player% VoidAntiCheat: подозрительная активность (%check%, VL %vl%)"

# Необязательный Discord webhook по наказаниям/высоким VL. Пусто = выключено.
webhook:
  enabled: false
  url: ""
  min-vl: 10.0
  cooldown-seconds: 60

# Тонкая настройка механик. Пороги специально консервативные под Bedrock/Geyser:
# лучше поймать устойчивый чит серией VL, чем кикать за лаг или тач-ввод.
movement:
  # Speed token bucket: разовый рывок допускается, штраф — за устойчивый перерасход.
  speed-burst-blocks: 1.30
  speed-token-cap: 4.5
  # Один move-пакет дальше этого без телепорта считается невозможным.
  teleport-delta-blocks: 24.0
  # Timer: position-движений к серверным тикам за окно.
  timer-ratio: 1.24
  timer-extra-packets: 24
  timer-window-ticks: 100
  # Fly/Hover.
  hover-max-dy: 0.040
  hover-ticks: 5
  ascent-ticks: 3
  slow-fall-ticks: 6
  # NoFall.
  nofall-min-drop: 5.0
  nofall-server-fall-ratio: 0.30
  # Step/Jesus/Spider/NoClip.
  step-min-dy: 0.96
  jesus-ticks: 7
  climb-ticks: 8
  noclip-ticks: 3

combat:
  # Дистанция от глаза до БЛИЖАЙШЕЙ точки хитбокса цели.
  reach-max-blocks: 3.45
  # На тач-вводе Bedrock серверная картина атаки чуть шумнее.
  reach-touch-max-blocks: 3.65
  # Дальше этого удар отменяется сразу: это физически невозможно в survival.
  reach-hard-cancel-blocks: 4.60
  # Компенсация пинга цели: блоков за 100 мс, но не больше максимума.
  reach-ping-comp-per-100ms: 0.045
  reach-ping-comp-max-blocks: 0.40
  # KillAura эвристики (только сериями, не за один удар).
  killaura-multi-targets: 4
  killaura-window-ms: 1000
  killaura-wall-min-distance: 1.60
  # AutoClicker. У Bedrock удержание атаки может давать ровные ~20 CPS,
  # поэтому порог выше и отдельная проверка ровности интервалов мягкая.
  autoclicker-cps: 24
  autoclicker-touch-cps: 27
  autoclicker-consistent-min-cps: 25.0
  autoclicker-consistent-max-deviation-ms: 1.5
  autoclicker-sample-clicks: 28
  # Velocity/AntiKB: сверка ожидаемого нокбэка с фактическим перемещением.
  velocity-check-ticks: 5
  velocity-min-expected-blocks: 1.10
  velocity-min-travel-ratio: 0.30

world:
  fastbreak-per-second: 28
  fastbreak-same-tick: 4
  fastplace-per-second: 28
  fastplace-same-tick: 4
  # Рука до блока: survival vanilla ~4.5, порог с Bedrock запасом.
  blockreach-max-blocks: 6.20
  blockreach-hard-cancel-blocks: 7.00
  # Scaffold: блоки строго под ногами на скорости, не крадучись и серией.
  scaffold-window-ms: 5000
  scaffold-places-in-window: 3
  scaffold-min-speed-bps: 3.0
  scaffold-max-pitch: 55.0

elytra:
  climb-dy-per-tick: 0.55
  climb-ticks: 4
  max-horizontal-bps: 118.0
  boost-grace-ms: 4000

vehicle:
  # Лодки на льду очень быстрые — отдельные лимиты по поверхности под лодкой.
  water-max-bps: 16.0
  ground-max-bps: 14.0
  ice-max-bps: 34.0
  packed-ice-max-bps: 40.0
  blue-ice-max-bps: 48.0
  burst-blocks: 3.0

