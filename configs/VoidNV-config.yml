# ============================================================
#  VoidNV — /nv: ночное зрение навсегда (VoidPE)
#
#  Игрок пишет /nv и получает ночное зрение без срока.
#  Умер — эффект пропал (игра сама снимает эффекты при смерти)
#  и плагин его НЕ возвращает: включай заново командой.
#  Повторная команда — не чаще, чем раз в cooldown-seconds.
# ============================================================

# Кулдаун команды /nv в секундах (5 минут).
cooldown-seconds: 300

messages:
  enabled: '&#7CFC00Ночное зрение включено. &7Действует до смерти.'
  already: '&eНочное зрение уже включено.'
  cooldown: '&cПодожди ещё &f{seconds} сек. &cперед повторным использованием /nv.'
  no-permission: '&cНет доступа к команде /nv.'
  players-only: '&cКоманда только для игроков.'
