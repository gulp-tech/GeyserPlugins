# ============================================================
# DeluxeMenus — главное меню VoidPE с иконками пака (стиль FunTime)
# Файл: plugins/DeluxeMenus/gui_menus/menu.yml
# (старый menu.yml сохраните как menu.yml.bak — этот его заменяет)
#
# Иконки — глифы из VoidResourcePack.mcpack, страница E140–E14F.
# В файле они стоят настоящими символами, поэтому файл должен остаться в UTF-8
# (не пересохраняйте в Windows-1251). Коды, если понадобится:
#   E140 магазин · E141 кейс · E142 донат · E143 задания · E144 клан
#   E145 топ · E146 настройки · E147 закрыть · E148 влево · E149 вправо
#   E14A ключ · E14B подарок · E14C арена · E14D шахта · E14E звезда · E14F инфо
#
# Без пака вместо иконок будут «пустые квадраты» — пак обязателен.
#
# Кнопки открывают: /shop, /keys, /donate, /quests, /clan, /top, /warp pvp, /warp mine.
# Если какой-то команды на сервере ещё нет (например /quests или /clan) — удалите
# эту кнопку из items или поменяйте command, иначе игрок увидит «Unknown command».
# ============================================================

