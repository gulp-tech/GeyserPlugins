# ============================================================
#  AuthMe — commands.yml для сервера VoidPE (Bedrock)
#  Готовый файл: положить в plugins/AuthMe/commands.yml
#
#  Плейсхолдеры: %p — ник, %nick — никнейм, %ip — IP, %country — страна.
#  executor: CONSOLE — от консоли, PLAYER — от самого игрока.
#  delay — задержка в тиках (20 тиков = 1 секунда), необязательно.
# ============================================================

# Срабатывает при каждом входе игрока (регистрация не нужна,
# просто зашёл на сервер — ещё до ввода /login).
onJoin:
  hint:
    # Подсказка в первые секунды, пока AuthMe просит пароль.
    command: 'msg %p &6VoidPE: &fесли попросит пароль — введи &e/login <пароль>&f, если ты тут впервые — &e/register <пароль> <пароль>'
    executor: CONSOLE
    delay: 40

# Успешный вход по паролю (/login). Возврат игрока на прежнее место
# делает сам VoidAuthSpawn — тут только приветствие.
onLogin:
  welcome-back:
    command: 'msg %p &aС возвращением на &6VoidPE&a!'
    executor: CONSOLE

# Вход по сохранённой сессии (sessions в config.yml у нас выключены,
# поэтому событие не используется; оставлено на случай включения сессий).
onSessionLogin: {}

# Первый вход в жизни аккаунта (поле last login было пустым).
onFirstLogin:
  greet:
    command: 'broadcast &6VoidPE &8» &f%p &7впервые зашёл на сервер, поприветствуем!'
    executor: CONSOLE

# Успешная регистрация нового игрока (/register).
# К точке регистрации и обратно игрока ведёт VoidAuthSpawn.
onRegister:
  welcome:
    command: 'msg %p &aРегистрация завершена! &fДобро пожаловать на &6VoidPE&f. Приятной игры!'
    executor: CONSOLE
  announce:
    command: 'broadcast &6VoidPE &8» &fНа сервере новый игрок: &e%p&f!'
    executor: CONSOLE

# Игрок удалил свой аккаунт (сам или через админа).
onUnregister: {}

# Авторизованный игрок вышел (/logout или просто покинул сервер).
# Если сервер упадёт — команды не выполнятся, опасного сюда не ставим.
onLogout: {}
