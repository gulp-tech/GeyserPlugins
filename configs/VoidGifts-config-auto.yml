# =====================================================
# VoidGifts — подарки-головы
# Голова с текстурой подарка ставится в мире.
# Игрок нажимает (ПКМ) — получает награду из gifts.yml (команда от консоли).
# Каждому игроку награда выдаётся ОДИН РАЗ на конкретный подарок.
# Все настройки этого файла — общие; типы подарков (головы) — в gifts.yml.
# =====================================================

# Громкость (0.0–1.0) и питч (0.5–2.0) музыки для нажавшего
music-volume: 1.0
music-pitch: 2.0

# Сколько секунд играет трек, потом глушится автоматически
music-seconds: 8

# Куда класть сгенерированный Bedrock-пак (Geyser packs). Относительный путь — от корня сервера.
# Поставь false, чтобы не собирать пак (например, только Java).
bedrock-pack-path: plugins/Geyser-Spigot/packs/VoidGiftsPack.mcpack

# Автоматическая сборка Bedrock-пака из файлов OGG при запуске сервера.
auto-pack: true

messages:
  created: '&aГолова подарка «{type}» выдана. Поставь её куда хочешь.'
  given: '&aВыдано голов подарка «{type}»: {count} шт.'
  unknown-type: '&cНеизвестный тип подарка «{type}». Смотри gifts.yml.'
  list-header: '&eТипы подарков (gifts.yml):'
  list-entry: '&7- &f{type} &8— {name}'
  already-opened: '&7Ты уже открывал этот подарок.'
  opened: '&aВы открыли подарок «{name}»!'
  reloaded: '&aVoidGifts перезагружен. Типов: {types}, звуков в паке: {sounds}. Игрокам нужен перезаход, чтобы услышать новые.'
  pack-failed: '&cНе удалось собрать VoidGiftsPack.mcpack: {error}'
  no-permission: '&cНет прав.'
