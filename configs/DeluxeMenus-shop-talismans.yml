    - 53
    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '

  'Баланс':
    slots:
    - 13
    material: PRISMARINE_SHARD
    display_name: '&bТвои осколки'
    lore:
      - ''
      - '&fБаланс: &b%playerpoints_points% осколков'
      - '&7Ими оплачиваются покупки в этом магазине.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'

  'Талисман воина':
    slots:
    - 19
    material: TOTEM_OF_UNDYING
    item_model: voidtalismans:menu_crusher
    model_data_component:
      floats: [6]
    display_name: '&cТалисман воина'
    lore:
      - ''
      - '&7Работает только в левой руке.'
      - ''
      - '&7Урон: &a+2'
      - '&7Броня: &a+4'
      - '&7Здоровье: &a+2'
      - ''
      - '&fЦена: &b423 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '423'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 423, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 423'
      - '[console] talisman give %player_name% crusher 1'
      - '[message] &aПокупка успешна: &cТалисман воина'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

