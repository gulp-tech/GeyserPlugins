# DeluxeMenus — раздел: талисманы
# Файл на сервере: plugins/DeluxeMenus/gui_menus/shop_talismans.yml
# Покупки списывают осколки PlayerPoints (points take) только если хватает:
# проверка click_requirement по %playerpoints_points% стоит на каждом товаре.
# Цены меняются прямо в этом файле: output и points take должны совпадать.
menu_title: '• Магазин: талисманы'
open_command: shoptalismans
register_command: true
size: 27
open_commands:
  - '[sound] ITEM_BOOK_PAGE_TURN'
items:

  'Баланс':
    slots:
    - 4
    material: PRISMARINE_SHARD
    display_name: '&#54C8FFТвои осколки'
    lore:
      - ''
      - '&fБаланс: &#54C8FF%playerpoints_points% осколков'
      - '&7Ими оплачиваются покупки в этом магазине.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'

  'Талисман воина':
    slots:
    - 9
    material: TOTEM_OF_UNDYING
    display_name: '&#FF5555Талисман воина'
    lore:
      - ''
      - '&7Работает только в левой руке.'
      - ''
      - '&7Урон: &a+2'
      - '&7Броня: &a+4'
      - '&7Здоровье: &a+2'
      - ''
      - '&fЦена: &#54C8FF1000 осколков'
      - '&7Твой баланс: &#54C8FF%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '1000'
      deny_commands:
        - '[message] &#FF6B6BНе хватает осколков: нужно 1000, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 1000'
      - '[console] talisman give %player_name% crusher 1'
      - '[message] &#7CFC00Покупка успешна: &#FF5555Талисман воина'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

