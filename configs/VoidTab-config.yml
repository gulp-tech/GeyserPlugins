# ============================================================
#  VoidTab — скорборд, TAB и ник над головой сервера VoidPE
#  Ядро Purpurbedrock 26.2 (сервер только для Bedrock), Java 25
#
#  Цвета: &a, &#FFB340 (hex), <gradient:#FF7A00:#FFFFFF>Текст</gradient>
#  Плейсхолдеры плагина:
#    {player} {group} {group_raw} {coins} {coins_raw} {shards}
#    {kills} {deaths} {kd} {online} {max} {ping}
#    {playtime} {playtime_hours} {playtime_minutes} {world} {title}
#    {device} — название устройства (Windows/Android/iOS...)
#  Плейсхолдеры ядра Purpurbedrock (можно вставлять в строки как %...%):
#    %purpurbedrock_device% %purpurbedrock_device_id% %purpurbedrock_os%
#    %purpurbedrock_input% %purpurbedrock_device_model% %purpurbedrock_version%
#    %purpurbedrock_ping% %purpurbedrock_ping_colored% %purpurbedrock_is_phone_kbm%
#  3) Любые другие %плейсхолдеры% PlaceholderAPI (hooks.placeholderapi ниже).
#
#  РЕСУРСПАКА НЕТ: он давал лаги при появлении игроков, поэтому иконок-картинок
#  в проекте больше нет. Скорборд и ник — текстовые. Если понадобятся символы,
#  впиши их в icons (например coin: '★') и добавь {icon:coin} в строку.
# ============================================================

# Игрок, зашедший с Java мимо ядра/Geyser, будет кикнут (на ядре Purpurbedrock
# все подключения уже Bedrock, так что проверка просто страхует).
bedrock-only:
  enabled: true
  kick-message: |
    &cVoidPE — сервер только для Bedrock!
    &7Заходи с телефона, планшета или Windows.

# Большой заголовок при входе (после загрузки мира). Тики: 20 = 1 сек.
join-title:
  enabled: true
  title: '&b&lVoidPE'
  subtitle: '&fДобро пожаловать, &#FFA63D{player}&f!'
  fade-in-ticks: 10
  stay-ticks: 70
  fade-out-ticks: 20

# Задержка перед первым показом после захода, тики (дать клиенту прогрузиться).
join-delay-ticks: 20

# Как часто обновлять скорборд и ник, тики (20 = 1 сек, 40 = раз в 2 сек).
update-interval-ticks: 40

# LuckPerms — единый источник префикса и титула.
# Метаданные кэшируются на cache-seconds: смена привилегии применится максимум
# через столько секунд (после /voidtab refresh или сообщения в чат — сразу).
luckperms:
  refresh-cache: true
  refresh-cache-seconds: 10
  # Досылать имена, если ничего не изменилось. 0 в интервале = только при
  # реальных изменениях (рекомендуется: иначе все клиенты перерисовывают ники).
  force-name-resend: true
  force-name-resend-interval-seconds: 0
  cache-seconds: 5

# Производительность. Значения по умолчанию рассчитаны на слабые телефоны.
performance:
  # Как часто определять устройство игрока (рефлексия в ядро), сек.
  device-cache-seconds: 30
  # Сколько игроков обновлять за проход. 0 — авто (полный круг ≈ update-interval-ticks).
  batch-size: 0
  # true — над головой только значки без названия привилегии (легче в толпе).
  light-nametags: false
  # Пауза после телепорта перед обновлением ника (не в тик появления игрока).
  appearance-delay-ticks: 5
  # Сколько появившихся игроков обрабатывать за тик (1 — максимально гладко).
  appearance-per-tick: 1
  # Кэш пинга для скорборда, сек.
  ping-cache-seconds: 2

scoreboard:
  enabled: true
  # Запоминать тех, кто скрыл скорборд командой /voidtab toggle (файл hidden.yml).
  remember-hidden: true

  # Заголовок скорборда: текст с &-кодами, &#RRGGBB или градиентом.
  title: '&b&lVoidPE'

  # Строки (макс. 15). Пустая строка '' — отступ.
  lines:
    - '&fИмя: &#FFA63D{player}'
    - '&fДонат: {group}'
    - '&fТитул: {title}'
    - '&fМонеты: &#FFD93D{coins}'
    - '&fОсколки: &#54C8FF{shards}'
    - ''
    - '&fПинг: &#7CFC00%purpurbedrock_ping%&f мс'
    - '&fВерсия: &#FFA63D%purpurbedrock_version%'
    - '&fУ/С: &#C86BFF{kills}&f/&#FF6B6B{deaths}'
    - '&fВ игре: &#FFD93D{playtime_hours}ч'

# ------------------------------------------------------------
# Символы вместо картинок. Секция ПУСТАЯ: ресурспак убран, глифов нет.
# Нужен значок — впиши любой символ и добавь {icon:имя} в строку скорборда:
#   coin: '★'
# Ключи ниже используются и ником: {group_icon} берёт icons.<группа>,
# значок устройства — icons.<windows|android|apple|...>.
icons: {}

# ------------------------------------------------------------
# Ник над головой: [привилегия] Ник, снизу здоровье.
# Работает через команды скорборда — не выключай use-teams, иначе ник
# останется без префикса. В невидимости ник и здоровье скрывает сама игра.
nametag:
  enabled: true
  # Значок привилегии из icons.<группа>. Пока icons пустая — ничего не добавится.
  rank-icon: false
  # Название привилегии текстом (префикс LuckPerms) перед ником.
  rank-name: true
  # Значок устройства из icons.<device>. Пока icons пустая — ничего не добавится.
  device-icon: false
  # Цвет ника после префикса.
  prefix-color: '&f'
  # Дублировать ник в display-name (оттуда ядро берёт неймтег).
  use-display-name: true
  # Команды скорборда для неймтегов: именно они рисуют оформление над головой.
  use-teams: true
  # В TAB после ника писать устройство словом: MUSD38 (Windows).
  device-name-in-tab: true
  # Титул (суффикс LuckPerms) после ника в TAB.
  title-in-tab: true
  # Здоровье под ником: число ставит игра, суффикс — плагин.
  health-below-name: true
  health-suffix: '&c❤'
  # Ручное исправление устройства, если клиент врёт: ник: windows|android|apple|kbmouse
  device-overrides: {}
  device-names:
    windows: Windows
    android: Android
    apple: iOS
    mac: Mac OS
    amazon: Amazon Fire
    xbox: Xbox
    playstation: PlayStation
    switch: Nintendo Switch
    vr: VR
    tv: TV
    controller: Геймпад
    kbmouse: Клавиатура+мышь
    device: Устройство

# ------------------------------------------------------------
# Названия привилегий. Сначала берётся префикс LuckPerms (единый источник),
# поэтому display ниже нужен только как запасной вариант.
groups:
  use-luckperms-prefix: true
  use-luckperms-display-name: false

  default:
    display: '&#CFCFCFИгрок'
  strannik:
    display: '&#CFCFCFСтранник'
  geroy:
    display: '&#55FF55Герой'
  rycar:
    display: '&#FFFF55Рыцарь'
  baron:
    display: '&#FFAA00Барон'
  lord:
    display: '&#55FFFFЛорд'
  knyaz:
    display: '&#FF55FFКнязь'
  imperator:
    display: '&#FFD93DИмператор'
  youtuber:
    display: '&#FF5555Ютубер'
  tiktoker:
    display: '&#55E6FFТиктокер'
  stazher:
    display: '&#FFD166Стажёр'
  kurator:
    display: '&#C86BFFКуратор'
  helper:
    display: '&#55FF55Хелпер'
  moderator:
    display: '&#5B8CFFМодератор'
  sozdatel:
    display: '&#FF5555Создатель'
  owner:
    display: '&#FF6A00Владелец'

# ------------------------------------------------------------
# Монеты — Vault Economy, осколки — PlayerPoints.
coins:
  decimals: 0
  grouping: true
  use-vault-format: false
shards:
  grouping: true
numbers:
  grouping-separator: ' '

# Значения, если Vault/PlayerPoints не подключены.
defaults:
  coins: '0'
  shards: '0'
  no-title: '&7Нет'

# {playtime}: {h} — часы, {m} — минуты.
playtime:
  format: '{h}ч {m}м'

# Обрабатывать %...% плейсхолдеры в строках (нужно для %purpurbedrock_*%).
hooks:
  placeholderapi: true

messages:
  prefix: '&#FFB340VoidPE &8» &f'
  reloaded: '&aКонфиг перезагружен.'
  refreshed: '&aПрефикс, скорборд, TAB и ник обновлены.'
  no-permission: '&cУ вас нет прав на эту команду.'
  player-not-found: '&cИгрок не найден.'
  shown: '&aСкорборд включён.'
  hidden: '&eСкорборд скрыт. Включить: &f/voidtab on'
