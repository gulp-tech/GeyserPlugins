# ============================================================
#  AuthMe — config.yml для сервера VoidPE (Purpur 26.2 + Geyser/Floodgate)
#  Готовый файл: положить в plugins/AuthMe/config.yml
#
#  Настроено под связку с VoidAuthSpawn:
#   * SaveQuitLocation: true — AuthMe сохраняет место выхода игрока,
#     оттуда VoidAuthSpawn берёт «прежнее место» для возврата.
#   * teleportUnAuthedToSpawn: false и ForceSpawnLocOnJoin: false —
#     игрока к точке регистрации и обратно ведёт VoidAuthSpawn,
#     собственные телепорты AuthMe с ним бы дрались.
#   * Сообщения AuthMe — на русском, имя сервера — VoidPE.
# ============================================================

DataSource:
    backend: SQLITE
    caching: true
    mySQLHost: 127.0.0.1
    mySQLPort: '3306'
    mySQLUseSSL: true
    mySQLCheckServerCertificate: true
    mySQLAllowPublicKeyRetrieval: true
    mySQLUsername: authme
    mySQLPassword: '12345'
    mySQLDatabase: authme
    mySQLTablename: authme
    mySQLColumnId: id
    mySQLColumnName: username
    mySQLRealName: realname
    mySQLColumnPassword: password
    mySQLColumnSalt: ''
    mySQLColumnEmail: email
    mySQLColumnLogged: isLogged
    mySQLColumnHasSession: hasSession
    mySQLtotpKey: totp
    mySQLColumnIp: ip
    mySQLColumnLastLogin: lastlogin
    mySQLColumnRegisterDate: regdate
    mySQLColumnRegisterIp: regip
    mySQLlastlocX: x
    mySQLlastlocY: y
    mySQLlastlocZ: z
    mySQLlastlocWorld: world
    mySQLlastlocYaw: yaw
    mySQLlastlocPitch: pitch
    mySQLPlayerUUID: ''
    mySQLColumnPremiumUUID: premiumUUID
    poolSize: 10
    maxLifetime: 1800
ExternalBoardOptions:
    mySQLColumnGroup: ''
    nonActivedUserGroup: -1
    mySQLOtherUsernameColumns: []
    bCryptLog2Round: 12
    phpbbTablePrefix: phpbb_
    phpbbActivatedGroupId: 2
    IPBTablePrefix: ipb_
    IPBActivatedGroupId: 3
    XFTablePrefix: xf_
    XFActivatedGroupId: 2
    wordpressTablePrefix: wp_
settings:
    sessions:
        # Сессии выключены: каждый вход — с паролем. Включи (true),
        # если хочешь, чтобы 10 минут после выхода пароль не спрашивался.
        enabled: false
        timeout: 10
    # Язык сообщений AuthMe по умолчанию — русский.
    messagesLanguage: ru
    # У кого клиент не на русском — свой язык клиента, иначе ru.
    perPlayerLocale: true
    forceVaultHook: false
    logLevel: FINE
    useAsyncTasks: true
    # Имя сервера (показывается в некоторых сообщениях AuthMe).
    serverName: VoidPE
    restrictions:
        # Неавторизованные не могут писать в чат и слать команды,
        # кроме разрешённых ниже.
        allowChat: false
        hideChat: false
        allowCommands:
        - /login
        - /log
        - /l
        - /register
        - /reg
        - /email
        - /captcha
        - /2fa
        - /totp
        # Одна регистрация с одного IP.
        maxRegPerIp: 1
        minNicknameLength: 3
        maxNicknameLength: 16
        ForceSingleSession: true
        ForceSpawnLocOnJoin:
            # ВЫКЛЮЧЕНО специально: иначе AuthMe после входа телепортирует
            # игрока на спавн и затирает место выхода — возврат
            # VoidAuthSpawn на прежнее место работать не будет.
            enabled: false
            worlds:
            - world
            - world_nether
            - world_the_end
        # ВКЛЮЧЕНО: AuthMe сохраняет, где игрок вышел. VoidAuthSpawn берёт
        # это место как «прежнее» и возвращает игрока туда при входе и
        # после /login.
        SaveQuitLocation: true
        AllowRestrictedUser: false
        AllowedRestrictedUser: []
        banUnsafedIP: false
        kickNonRegistered: false
        kickOnWrongPassword: true
        # ВЫКЛЮЧЕНО специально: невошедших к спавну/точке и обратно ведёт
        # VoidAuthSpawn. Если включить и это — два плагина будут
        # перетягивать игрока телепортами.
        teleportUnAuthedToSpawn: false
        # Невошедшим ходить нельзя (стоят у точки, пока не введут пароль).
        allowMovement: false
        # На ввод пароля — 2 минуты (с телефона печатать дольше, чем 30 сек).
        loginTimeout: 120
        registerTimeout: 120
        allowedNicknameCharacters: '[a-zA-Z0-9_]*'
        allowedMovementRadius: 100
        # Требует PacketEvents; без него AuthMe просто пропускает защиту.
        ProtectInventoryBeforeLogIn: true
        DenyTabCompleteBeforeLogin: false
        displayOtherAccounts: true
        spawnPriority: authme,essentials,cmi,multiverse,default
        maxLoginPerIp: 0
        maxJoinPerIp: 0
        # false: AuthMe разрешено телепортировать (нужно его внутренним местам).
        noTeleport: false
        allowedPasswordCharacters: '[!-~]*'
    GameMode:
        ForceSurvivalMode: false
    unrestrictions:
        UnrestrictedName: []
        UnrestrictedInventories: []
    security:
        minPasswordLength: 5
        passwordMaxLength: 30
        passwordHash: SHA256
        legacyHashes: []
        doubleMD5SaltLength: 8
        pbkdf2Rounds: 10000
        unsafePasswords:
        - '123456'
        - password
        - qwerty
        - '12345'
        - '54321'
        - '123456789'
        - help
    registration:
        enabled: true
        messageInterval: 5
        force: true
        type: PASSWORD
        # /register <пароль> <пароль> — как в подсказках VoidAuthSpawn.
        secondArg: CONFIRMATION
        forceKickAfterRegister: false
        forceLoginAfterRegister: false
        dialog:
            showForgotPasswordButton: true
            showBody: true
            preJoin:
                enable: true
                showCancelButton: true
                allowCloseWithEscape: false
                registerCancelKicks: false
                loginCancelKicks: true
            postJoin:
                # Графические диалоги Bedrock-клиент через Geyser всё равно
                # не покажет — Bedrock-игроки вводят /register и /login в чат.
                enable: true
    useWelcomeMessage: true
    broadcastWelcomeMessage: false
    delayJoinMessage: false
    customJoinMessage: ''
    removeUnloggedLeaveMessage: false
    removeJoinMessage: false
    removeLeaveMessage: false
    applyBlindEffect: false
    preventOtherCase: true
    enablePremium: false
GroupOptions:
    enablePermissionCheck: false
    registeredPlayerGroup: ''
    unregisteredPlayerGroup: ''
Email:
    mailSMTP: smtp.gmail.com
    mailPort: 465
    useTls: true
    mailAccount: ''
    mailPassword: ''
    mailAddress: ''
    mailSenderName: ''
    RecoveryPasswordLength: 8
    mailSubject: Your new AuthMe password
    maxRegPerEmail: 1
    recallPlayers: false
    delayRecall: 5
    emailBlacklisted:
    - 10minutemail.com
    emailWhitelisted: []
    generateImage: false
    emailOauth2Token: ''
    sslCheckServerIdentity: true
Hooks:
    multiverse: true
    bungeecord: false
    sendPlayerTo: ''
    proxySharedSecret: ''
    disableSocialSpy: false
    useEssentialsMotd: false
Protection:
    enableProtection: false
    enableProtectionRegistered: true
    geoIpDatabase:
        enabled: true
        clientId: ''
        licenseKey: ''
    countries:
    - US
    - GB
    - LOCALHOST
    countriesBlacklist:
    - A1
    enableAntiBot: true
    antiBotInterval: 5
    antiBotSensibility: 10
    antiBotDuration: 10
    antiBotDelay: 60
    quickCommands:
        denyCommandsBeforeMilliseconds: 1000
Purge:
    useAutoPurge: false
    daysBeforeRemovePlayer: 60
    removePlayerDat: false
    removeEssentialsFile: false
    defaultWorld: world
    removeLimitedCreativesInventories: false
    removeAntiXRayData: false
    removePermissions: false
Security:
    SQLProblem:
        stopServer: true
    console:
        logConsole: true
    captcha:
        useCaptcha: false
        maxLoginTry: 5
        captchaLength: 5
        captchaCountReset: 60
        requireForRegistration: false
    tempban:
        enableTempban: false
        maxLoginTries: 10
        tempbanLength: 480
        minutesBeforeCounterReset: 480
        customCommand: ''
    recoveryCode:
        length: 8
        validForHours: 4
        maxTries: 3
        passwordChangeTimeout: 2
    emailRecovery:
        cooldown: 60
    privacy:
        enableEmailMasking: false
        verificationCodeExpiration: 10
limbo:
    persistence:
        type: INDIVIDUAL_FILES
        distributionSize: SIXTEEN
    restoreAllowFlight: RESTORE
    restoreFlySpeed: RESTORE_NO_ZERO
    restoreWalkSpeed: RESTORE_NO_ZERO
    recreateEnderPearls: true
BackupSystem:
    ActivateBackup: false
    OnServerStart: false
    OnServerStop: true
    MysqlWindowsPath: C:\Program Files\MySQL\MySQL Server 5.1\
