# DeluxeMenus — раздел: кастомные предметы
# Файл на сервере: plugins/DeluxeMenus/gui_menus/shop_items.yml
# Покупки списывают осколки PlayerPoints (points take) только если хватает:
# проверка click_requirement по %playerpoints_points% стоит на каждом товаре.
# Цены меняются прямо в этом файле: output и points take должны совпадать.
menu_title: '• Магазин: предметы'
open_command: shopitems
register_command: true
size: 27
open_commands:
  - '[sound] ITEM_BOOK_PAGE_TURN'
items:

  'Баланс':
    slots:
    - 4
    material: PRISMARINE_SHARD
    display_name: '&#54C8FFТвои осколки'
    lore:
      - ''
      - '&fБаланс: &#54C8FF%playerpoints_points% осколков'
      - '&7Ими оплачиваются покупки в этом магазине.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'

  'Капкан':
    slots:
    - 9
    material: NETHERITE_SCRAP
    display_name: '&#B388FFКапкан'
    lore:
      - ''
      - '&7ПКМ: капкан появляется там, где ты стоишь.'
      - '&7Клетка 3×3 держится 20 секунд.'
      - ''
      - '&fЦена: &#54C8FF300 осколков'
      - '&7Твой баланс: &#54C8FF%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '300'
      deny_commands:
        - '[message] &#FF6B6BНе хватает осколков: нужно 300, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 300'
      - '[console] items give %player_name% trapka 1'
      - '[message] &#7CFC00Покупка успешна: &#B388FFКапкан'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

