    tabcomplete:
      - spawn
      - home
      - sethome
      - delhome
      - tpa
      - tpaccept
      - tpdeny
      - pay
      - money
      - balance
      - warp
      - msg
      - r
      - ah
      - buyer
      - kit
      - feed
      - heal
      - craft
      - anvil
      - enderchest
      - ec
      - hat
      - repair
      - fix
      - nick
      - near
      - fly
      - rtp
      - help
      - skins
      - miner
      - miner2
      - keys
      - skin
      - afk
      - mail
      - balancetop
      - warps
      - points
      - menu
      - shop
      - shopitems
      - shoppotions
      - shoppickaxes
      - shoptalismans
      - shopspheres
      - vench
      - combat
      - shopenchants
      - wcity
      - donate
      - privshop
      - podryvnik
      - clan
      - cases
      - titles
      - voidtab
      - nv
      - event
      - events
    #If a player is in two groups, the group with the higher priority number is used
    #The minimum value is 0
    priority: 0
    #The message if you type a blocked command | Enter none to disable
    #Possible placeholders: {player}, {cmd}
    blocked-command-message: "Unknown command. Type \"/help\" for help."
    #Here you can add other groups: The commands and tab completion from the "inherited groups" will be added to this group
    #Read more here https://github.com/Nononitas/Plugin-Hide-Pro/wiki#Group#inheritance
    inherited-groups: []

  # Стажёр: все команды игроков (наследование от default) + варны и временные муты LiteBans.
  # Группа выдаётся правом plhide.group.stazher в LuckPerms.
  stazher:
    commands:
      - warn
      - unwarn
      - tempmute
      - unmute
      - history
      - warnings
      - checkwarn
      - checkmute
      - mutelist
      - warnlist
    tabcomplete:
      - warn
      - unwarn
      - tempmute
      - unmute
      - history
      - warnings
      - checkwarn
      - checkmute
      - mutelist
      - warnlist
    priority: 4
    blocked-command-message: "Unknown command. Type \"/help\" for help."
    inherited-groups:
      - default

  # Хелпер: все команды игроков (наследование от default) + модерация по мелочи.
  # Группа выдаётся правом plhide.group.helper в LuckPerms.
  helper:
    commands:
      - kick
      - mute
      - unmute
      - warn
      - unwarn
      - checkban
      - vanish
    tabcomplete:
      - kick
      - mute
      - unmute
      - warn
      - unwarn
      - checkban
      - vanish
    priority: 5
    blocked-command-message: "Unknown command. Type \"/help\" for help."
    inherited-groups:
      - default

  # Модератор: всё от хелпера (наследование helper -> default) + баны и тюрьма.
  # Группа выдаётся правом plhide.group.moderator в LuckPerms.
  moderator:
    commands:
      - ban
      - tempban
      - banip
      - unban
      - banlist
      - invsee
      - gamemode
      - tp
      - tphere
      - tppos
      - back
    tabcomplete:
      - ban
      - tempban
      - banip
      - unban
      - banlist
      - invsee
      - gamemode
      - tp
      - tphere
      - tppos
      - back
    priority: 8
    blocked-command-message: "Unknown command. Type \"/help\" for help."
    inherited-groups:
      - helper

  # Куратор: всё от модератора + контроль состава (история, откат наказаний, списки).
  # Группа выдаётся правом plhide.group.kurator в LuckPerms.
  kurator:
    commands:
      - ban
      - tempban
      - unban
      - banlist
      - mute
      - tempmute
      - unmute
      - mutelist
      - warn
      - unwarn
      - warnlist
      - kick
      - history
      - staffhistory
      - staffrollback
      - warnings
      - checkban
      - checkmute
      - checkwarn
      - invsee
      - vanish
      - gamemode
      - tp
      - tphere
      - tppos
      - back
    tabcomplete:
      - ban
      - tempban
      - unban
      - banlist
      - mute
      - tempmute
      - unmute
      - mutelist
      - warn
      - unwarn
      - warnlist
      - kick
      - history
      - staffhistory
      - staffrollback
      - warnings
      - checkban
      - checkmute
      - checkwarn
      - invsee
      - vanish
      - gamemode
      - tp
      - tphere
      - tppos
      - back
    priority: 9
    blocked-command-message: "Unknown command. Type \"/help\" for help."
    inherited-groups:
      - moderator

  # Создатель: видны и доступны ВСЕ команды.
  # Группа выдаётся правом plhide.group.staff в LuckPerms.
  staff:
    commands:
      - "*"
    tabcomplete:
      - "*"
    priority: 10
    blocked-command-message: "Unknown command. Type \"/help\" for help."
    inherited-groups: []

