# DeluxeMenus — раздел: сферы
# Файл на сервере: plugins/DeluxeMenus/gui_menus/shop_spheres.yml
# Рамка — обычное ванильное чёрное стекло. Покупки списывают осколки
# PlayerPoints только если хватает (click_requirement на каждом товаре).
# Цены: output и points take в одном товаре должны совпадать.
menu_title: '• Магазин: сферы'
open_command: shopspheres
register_command: true
size: 45
open_commands:
  - '[sound] ITEM_BOOK_PAGE_TURN'
items:

  'Рамка':
    slots:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 36
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43
    - 44
    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '

  'Баланс':
    slots:
    - 22
    material: PRISMARINE_SHARD
    display_name: '&bТвои осколки'
    lore:
      - ''
      - '&fБаланс: &b%playerpoints_points% осколков'
      - '&7Ими оплачиваются покупки в этом магазине.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'

  'Сфера сумерек':
    slots:
    - 9
    material: PAPER
    item_model: voidspheres:sphere1
    model_data_component:
      floats: [9001.0]
    display_name: '&dСфера сумерек'
    lore:
      - ''
      - '&7Работает только в левой руке.'
      - ''
      - '&7Урон: &a+1'
      - '&7Броня: &a+1'
      - '&7Здоровье: &a+2'
      - ''
      - '&fЦена: &b525 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '525'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 525, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 525'
      - '[console] sphere give %player_name% 1 1'
      - '[message] &aПокупка успешна: &dСфера сумерек'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

