# DeluxeMenus — раздел: зелья
# Файл на сервере: plugins/DeluxeMenus/gui_menus/shop_potions.yml
# Рамка — обычное ванильное чёрное стекло. Покупки списывают осколки
# PlayerPoints только если хватает (click_requirement на каждом товаре).
# Цены: output и points take в одном товаре должны совпадать.
menu_title: '• Магазин: зелья'
open_command: shoppotions
register_command: true
size: 45
open_commands:
  - '[sound] ITEM_BOOK_PAGE_TURN'
items:

  'Рамка':
    slots:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 36
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43
    - 44
    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '

  'Баланс':
    slots:
    - 22
    material: PRISMARINE_SHARD
    display_name: '&bТвои осколки'
    lore:
      - ''
      - '&fБаланс: &b%playerpoints_points% осколков'
      - '&7Ими оплачиваются покупки в этом магазине.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'

  'Зелье ярости':
    slots:
    - 10
    material: POTION
    model_data_component:
      floats: [1]
    display_name: '&cЗелье ярости'
    lore:
      - ''
      - '&7Сила III + Скорость III на 3 минуты.'
      - ''
      - '&fЦена: &b78 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '78'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 78, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 78'
      - '[console] items give %player_name% pot_berserk 1'
      - '[message] &aПокупка успешна: &cЗелье ярости'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

  'Боевое зелье':
