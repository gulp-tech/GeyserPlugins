# DeluxeMenus — раздел: кирки
# Файл на сервере: plugins/DeluxeMenus/gui_menus/shop_pickaxes.yml
# Рамка — обычное ванильное чёрное стекло. Покупки списывают осколки
# PlayerPoints только если хватает (click_requirement на каждом товаре).
# Цены: output и points take в одном товаре должны совпадать.
menu_title: '• Магазин: кирки'
open_command: shoppickaxes
register_command: true
size: 45
open_commands:
  - '[sound] ITEM_BOOK_PAGE_TURN'
items:

  'Рамка':
    slots:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 36
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43
    - 44
    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '

  'Баланс':
    slots:
    - 22
    material: PRISMARINE_SHARD
    display_name: '&bТвои осколки'
    lore:
      - ''
      - '&fБаланс: &b%playerpoints_points% осколков'
      - '&7Ими оплачиваются покупки в этом магазине.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'

  'Кирка шахтёра I':
    slots:
    - 11
    material: NETHERITE_PICKAXE
    display_name: '&6Кирка шахтёра &eI'
    lore:
      - ''
      - '&7Эффективность V, Удача III, Прочность III, Починка.'
      - '&7Автоплавка + Магнит.'
      - ''
      - '&fЦена: &b634 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '634'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 634, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 634'
      - '[console] vench give %player_name% miner1'
      - '[message] &aПокупка успешна: &6Кирка шахтёра &eI'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

  'Кирка шахтёра II':
    slots:
    - 13
    material: NETHERITE_PICKAXE
    display_name: '&6Кирка шахтёра &eII'
    lore:
      - ''
      - '&7Эффективность VI, Удача IV, Прочность IV, Починка.'
      - '&7Автоплавка + Магнит + Бур I.'
      - ''
      - '&fЦена: &b1479 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '1479'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 1479, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 1479'
      - '[console] vench give %player_name% miner2'
      - '[message] &aПокупка успешна: &6Кирка шахтёра &eII'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

  'Кирка шахтёра III':
    slots:
    - 15
    material: NETHERITE_PICKAXE
    display_name: '&6Кирка шахтёра &eIII'
    lore:
      - ''
      - '&7Эффективность VII, Удача V, Прочность V, Починка.'
      - '&7Автоплавка + Магнит + Бур II.'
      - ''
      - '&fЦена: &b2958 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
