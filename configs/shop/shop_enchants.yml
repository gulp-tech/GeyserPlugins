# DeluxeMenus — раздел: кастомные зачарования
# Файл на сервере: plugins/DeluxeMenus/gui_menus/shop_enchants.yml
# Рамка — обычное ванильное чёрное стекло. Покупки списывают осколки
# PlayerPoints только если хватает (click_requirement на каждом товаре).
# Цены: output и points take в одном товаре должны совпадать.
menu_title: '• Магазин: зачарования'
open_command: shopenchants
register_command: true
size: 45
open_commands:
  - '[sound] ITEM_BOOK_PAGE_TURN'
items:

  'Рамка':
    slots:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 36
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43
    - 44
    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '

  'Баланс':
    slots:
    - 22
    material: PRISMARINE_SHARD
    display_name: '&bТвои осколки'
    lore:
      - ''
      - '&fБаланс: &b%playerpoints_points% осколков'
      - '&7Ими оплачиваются покупки в этом магазине.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'

  'Книга Автоплавки':
    slots:
    - 11
    material: ENCHANTED_BOOK
    display_name: '&6Книга: Автоплавка'
    lore:
      - ''
      - '&7Добыча сразу плавится в готовый результат:'
      - '&7руда, булыжник и песок не требуют печи.'
      - '&7Книга накладывается на инструмент на наковальне.'
      - ''
      - '&fЦена: &b85 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '85'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 85, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 85'
      - '[console] vench give %player_name% book_autosmelt'
      - '[message] &aПокупка успешна: &6Книга: Автоплавка'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

  'Книга Магнита':
    slots:
    - 13
    material: ENCHANTED_BOOK
    display_name: '&bКнига: Магнит'
    lore:
      - ''
      - '&7Добытое само попадает в инвентарь,'
      - '&7а на топоре собирает дроп с убитых мобов.'
      - '&7Книга накладывается на инструмент на наковальне.'
      - ''
      - '&fЦена: &b95 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '95'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 95, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 95'
      - '[console] vench give %player_name% book_magnet'
      - '[message] &aПокупка успешна: &bКнига: Магнит'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

  'Книга Бура I':
    slots:
    - 15
    material: ENCHANTED_BOOK
    display_name: '&eКнига: Бур I'
    lore:
      - ''
      - '&7Инструмент ломает дополнительные блоки вокруг.'
      - '&7Две книги Бур I на наковальне дают Бур II.'
      - '&7Книга накладывается на инструмент на наковальне.'
      - ''
      - '&fЦена: &b304 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '304'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 304, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 200'
      - '[console] vench give %player_name% book_drill'
      - '[message] &aПокупка успешна: &eКнига: Бур I'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

  # ---------- Навигация по разделам ----------

  'Назад':
    slots:
    - 28
    material: ARROW
    display_name: '&fНазад'
    lore:
      - '&7В главное меню магазина.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'
      - '[openguimenu] shop'

  'Раздел: Зачарования':
    slots:
    - 29
    material: ENCHANTED_BOOK
    display_name: '&6&l▶ Зачарования'
    lore:
      - '&7Ты уже в этом разделе.'

  'Раздел: Предметы':
    slots:
    - 30
    material: CHEST
    display_name: '&bПредметы'
    lore:
      - '&7Перейти в раздел: &fПредметы&7.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'
      - '[openguimenu] shop_items'

  'Раздел: Кирки':
    slots:
    - 31
    material: NETHERITE_PICKAXE
    display_name: '&fКирки'
    lore:
      - '&7Перейти в раздел: &fКирки&7.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'
      - '[openguimenu] shop_pickaxes'

  'Раздел: Зелья':
    slots:
    - 32
    material: BREWING_STAND
    display_name: '&dЗелья'
    lore:
      - '&7Перейти в раздел: &fЗелья&7.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'
      - '[openguimenu] shop_potions'

  'Раздел: Сферы':
    slots:
    - 33
    material: END_CRYSTAL
    display_name: '&5Сферы'
    lore:
      - '&7Перейти в раздел: &fСферы&7.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'
      - '[openguimenu] shop_spheres'
