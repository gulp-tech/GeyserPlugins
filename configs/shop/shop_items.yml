    - 28
    material: ARROW
    display_name: '&fНазад'
    lore:
      - '&7В главное меню магазина.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'
      - '[openguimenu] shop'

  'Раздел: Зачарования':
