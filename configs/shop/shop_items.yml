# DeluxeMenus — раздел: кастомные предметы
# Файл на сервере: plugins/DeluxeMenus/gui_menus/shop_items.yml
# Рамка — обычное ванильное чёрное стекло. Покупки списывают осколки
# PlayerPoints только если хватает (click_requirement на каждом товаре).
# Цены: output и points take в одном товаре должны совпадать.
menu_title: '• Магазин: предметы'
open_command: shopitems
register_command: true
size: 45
open_commands:
  - '[sound] ITEM_BOOK_PAGE_TURN'
items:

  'Рамка':
    slots:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 36
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 43
    - 44
    material: BLACK_STAINED_GLASS_PANE
    display_name: ' '

  'Баланс':
    slots:
    - 22
    material: PRISMARINE_SHARD
    display_name: '&bТвои осколки'
    lore:
      - ''
      - '&fБаланс: &b%playerpoints_points% осколков'
      - '&7Ими оплачиваются покупки в этом магазине.'
    click_commands:
      - '[sound] ITEM_BOOK_PAGE_TURN'

  'Капкан':
    slots:
    - 10
    material: PAPER
    model_data_component:
      floats: [40]
    display_name: '&dКапкан'
    lore:
      - ''
      - '&7ПКМ: капкан появляется там, где ты стоишь.'
      - '&7Клетка 3×3 держится 20 секунд.'
      - ''
      - '&fЦена: &b107 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '107'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 107, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 107'
      - '[console] items give %player_name% trapka 1'
      - '[message] &aПокупка успешна: &dКапкан'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

  'Пыль обнаружения':
    slots:
    - 12
    material: GLOWSTONE_DUST
    display_name: '&eПыль обнаружения'
    lore:
      - ''
      - '&7ПКМ: игроки в радиусе 15 теряют'
      - '&7невидимость и подсвечиваются на 10 секунд.'
      - ''
      - '&fЦена: &b54 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '54'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 54, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 54'
      - '[console] items give %player_name% dust 1'
      - '[message] &aПокупка успешна: &eПыль обнаружения'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

  'Око дезориентации':
    slots:
    - 14
    material: ENDER_EYE
    display_name: '&bОко дезориентации'
    lore:
      - ''
      - '&7ПКМ: враги в радиусе 9 получают слепоту,'
      - '&7тошноту и замедление III на 5 секунд.'
      - ''
      - '&fЦена: &b90 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '90'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 90, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 90'
      - '[console] items give %player_name% dezorientation 1'
      - '[message] &aПокупка успешна: &bОко дезориентации'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

  'Лом для спавнеров':
    slots:
    - 16
    material: GOLDEN_PICKAXE
    display_name: '&6Лом для спавнеров'
    lore:
      - ''
      - '&7Сломай им спавнер — заберёшь его'
      - '&7вместе с мобом. Лом одноразовый.'
      - ''
      - '&fЦена: &b268 осколков'
      - '&7Твой баланс: &b%playerpoints_points%'
      - '&eНажми, чтобы купить'
    click_requirement:
      requirements:
        shards:
          type: '>='
          input: '%playerpoints_points%'
          output: '268'
      deny_commands:
        - '[message] &cНе хватает осколков: нужно 268, у тебя %playerpoints_points%.'
        - '[sound] ENTITY_VILLAGER_NO'
    click_commands:
      - '[console] points take %player_name% 268'
      - '[console] items give %player_name% spawner_lom 1'
      - '[message] &aПокупка успешна: &6Лом для спавнеров'
      - '[sound] ENTITY_PLAYER_LEVELUP'
      - '[refresh]'

  # ---------- Навигация по разделам ----------

  'Назад':
