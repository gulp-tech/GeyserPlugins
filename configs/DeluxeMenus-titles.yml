# DeluxeMenus — меню титулов VoidPE
# Файл в: plugins/DeluxeMenus/gui_menus/titles.yml
# Открытие: /titles (кнопка в главном меню: [player] titles)
# Титулы НЕ продаются и НЕ выдаются командами — они выбиваются
# ТОЛЬКО из кейса титулов (открывается предметом «Кейс титулов»
# или у поставленного кейса на спавне: /cases set titles).
