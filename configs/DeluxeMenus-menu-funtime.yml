      - "&7и зелья за монеты."
      - ""
      - "&#C86BFF➥ &fНажмите"
    item_flags:
      - HIDE_ATTRIBUTES
    click_commands:
      - "[sound] UI_BUTTON_CLICK"
      - "[player] shop"
      - "[close]"

  cases:
