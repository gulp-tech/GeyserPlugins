# ============================================================
# VoidRtpZone — зоны, при входе в которые игроку пишется /rtp
# Как пользоваться:
#   1) /rtpzone wand        — получить предмет-выделитель
#   2) ЛКМ по блоку — точка 1, ПКМ по блоку — точка 2
#   3) /rtpzone save <имя>  — сохранить зону (пишется в zones.yml)
# Зоны хранятся в plugins/VoidRtpZone/zones.yml и НЕ слетают
# при обновлении этого конфига.
# Цвета: &a, &#FFB340
# ============================================================

enabled: true

wand:
  # Предмет-выделитель. Метка плагина ставится невидимо (PDC),
  # переименованный вручную предмет зоной не считается.
  material: BLAZE_ROD
  name: "&#FFB340Выделитель зоны RTP"
  lore:
    - "&7ЛКМ по блоку — &fточка 1"
    - "&7ПКМ по блоку — &fточка 2"
    - "&7Сохранить: &f/rtpzone save <имя>"

trigger:
  # Команды при входе игрока в зону. Выполняются ОТ ИГРОКА
  # (as-console: true — от консоли, тогда доступен {player}).
  commands:
    - "rtp"
  as-console: false
  # Кулдаун повторного срабатывания на игрока, сек (анти-спам).
  cooldown-seconds: 10
  # В этих режимах зона не срабатывает (чтобы админ спокойно выделял).
  skip-gamemodes:
    - CREATIVE
    - SPECTATOR

messages:
  prefix: "&#8E6BFFRtpZone &8▏ &r"
  wand-given: "&aВыделитель выдан. ЛКМ — точка 1, ПКМ — точка 2."
  pos1: "&aТочка 1: &f{x}, {y}, {z}"
  pos2: "&aТочка 2: &f{x}, {y}, {z}"
  saved: "&aЗона &f{name}&a сохранена."
  removed: "&aЗона &f{name}&a удалена."
  no-selection: "&cСначала выдели обе точки предметом (/rtpzone wand)."
  no-such-zone: "&cЗоны &f{name}&c нет. Список: /rtpzone list"
  list-empty: "&7Зон пока нет."
  list-line: "&7• &f{name}&7 — мир &f{world}&7, {size} блоков"
  reloaded: "&aVoidRtpZone перезагружен, зон: &f{count}&a."
  admin-only: "&cТолько для админов (voidrtpzone.admin)."
  help:
    - "&#8E6BFFRtpZone &8— &fзоны с автозапуском /rtp"
    - "&f/rtpzone wand &7— предмет выделения (ЛКМ/ПКМ — точки)"
    - "&f/rtpzone save <имя> &7— сохранить зону"
    - "&f/rtpzone remove <имя> &7— удалить зону"
    - "&f/rtpzone list &7— список зон"
    - "&f/rtpzone reload &7— перезагрузить конфиг и zones.yml"
