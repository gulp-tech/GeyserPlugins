# ============================================================
#  VoidShulker — шалкер открывается прямо из руки (VoidPE)
#
#  ПКМ с шалкером в руке (по воздуху или по блоку) — открыть.
#  Shift+ПКМ — поставить шалкер на землю как обычно.
#  Работает с главной и второй рукой. Шалкер остаётся в инвентаре.
#  ЛКМ — взять/положить стак, ПКМ — половину или один предмет.
#  Можно класть в любой слот, использовать Shift-click, drag и цифровые клавиши.
#  Все операции сохраняются сразу; вложенные шалкеры и выброс из окна запрещены.
# ============================================================

# Заголовок окна открытого шалкера.
title: '&#B388FFШалкер'

# Звук открытия/закрытия (пусто — без звука).
sound-open: 'minecraft:block.shulker_box.open'
sound-close: 'minecraft:block.shulker_box.close'

# Вторая рука: открывать шалкер и из второй руки, если в главной нет шалкера.
offhand: true

messages:
  # Шалкеров в стаке больше одного (пустые стакаются): открой по одному.
  stacked: '&cСначала раздели шалкеры: открывать можно по одному.'
  no-permission: '&cНельзя открывать шалкер из руки.'
  creative: '&cОткрытие шалкера в творческом режиме отключено.'
  cursor: '&cСначала убери предмет с курсора.'
  invalid: '&cШалкер изменился извне, окно закрыто.'
