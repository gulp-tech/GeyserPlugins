# ═══════════════════════════════════════════════════════
#   Зажигательный заряд — Взрывчатка с поджогом
#   Радиус: 10 | Таймер: 3s | Огонь: 85%
# ═══════════════════════════════════════════════════════

tnt_fire:
  enabled: true

  item:
    material: TNT
    custom_model_data: 0
    enchanted: false
    name: '&eЗажигательный заряд'
    lore:
      - '&7Взрывчатка с поджогом'
      - ''
      - ' &8▸ &fХарактеристики:'
      - '   &8▸ &fРадиус взрыва: &a10 блоков'
      - '   &8▸ &fСпец. эффект: &eСоздает огонь'

  ignite:
    fuse-seconds: 3.0
    auto-ignite-on-place: false
    velocity:
      gravity: true
      upward: 0.5
    throw:
      enabled: false
      hand: any
      velocity-xz: 0.9
      velocity-y: 0.2
      auto-ignite: false
    allow:
      flint-and-steel: true
      fire-charge: true
      redstone: true
      fire: true
      explosion: true

  craft:
    enabled: true
    disable_vanilla_craft: false
    shape:
      - FGF
      - GTG
      - FGF
    ingredients:
      F: FIRE_CHARGE
      G: GUNPOWDER
      T: TNT

  conditions: []

  visual:
    sounds:
      ignite:
        enabled: true
        sound: ENTITY_TNT_PRIMED
        volume: 1.0
        pitch: 0.8
      explosion:
        enabled: true
        sound: ENTITY_GENERIC_EXPLODE
        volume: 5.0
        pitch: 0.9
    particles:
      enabled: true
      type: FLAME
      count: 40
      offset:
        x: 0.5
        y: 0.5
        z: 0.5
      extra: 0.05
    hologram:
      enabled: true
      type: armorstand
      line-spacing: 0.25
      lines:
        - '&eЗажигательный заряд'
        - '&7Взрыв через: &e{time}s'
        - '&6🔥 Выжигает территорию'
      height: 2.0
      update-period-ticks: 3
      displaytext:
        shadowed: true
        see-through: false
        default-background: false
        background-color: '#00000000'
        line-width: 200
        text-opacity: 255
        billboard: FIXED
        alignment: CENTER
        scale: 1.0
        glowing: false
        glow-color: '#FFFFFFFF'
    glow:
      enabled: true
      color: YELLOW
      animation:
        enabled: true
        colors:
          - YELLOW
          - GOLD
          - RED
          - GOLD
        period-ticks: 8

  explosion:
    radius: 10.0
    damage:
      enabled: true
      max-damage: 25.0
      min-damage: 3.0
      exposure: 1.0
    raycast:
      rays: 20
      strength-multiplier: 1.0
      resistance-multiplier: 1.0
    blocks:
      in-liquid: false
      max-blocks: 0
      default:
        mode: BREAK
        drop-chance: 0.5
      per-material:
        OBSIDIAN:
          mode: IGNORE
        CRYING_OBSIDIAN:
          mode: IGNORE
        ANCIENT_DEBRIS:
          mode: IGNORE
        BEDROCK:
          mode: IGNORE
        BARRIER:
          mode: IGNORE
        ENDER_CHEST:
          mode: IGNORE
        CHEST:
          mode: BREAK
          drop-chance: 1.0
        TRAPPED_CHEST:
          mode: BREAK
          drop-chance: 1.0
        BARREL:
          mode: BREAK
          drop-chance: 1.0
        # Временно не взрываем шалкеры: HyperTNT 2.0.0 может дублировать их содержимое.
        SHULKER_BOX:
          mode: IGNORE
          drop-chance: 1.0
        BLACK_SHULKER_BOX:
          mode: IGNORE
        RED_SHULKER_BOX:
          mode: IGNORE
        GREEN_SHULKER_BOX:
          mode: IGNORE
        BROWN_SHULKER_BOX:
          mode: IGNORE
        BLUE_SHULKER_BOX:
          mode: IGNORE
        PURPLE_SHULKER_BOX:
          mode: IGNORE
        CYAN_SHULKER_BOX:
          mode: IGNORE
        LIGHT_GRAY_SHULKER_BOX:
          mode: IGNORE
        GRAY_SHULKER_BOX:
          mode: IGNORE
        PINK_SHULKER_BOX:
          mode: IGNORE
        LIME_SHULKER_BOX:
          mode: IGNORE
        YELLOW_SHULKER_BOX:
          mode: IGNORE
        LIGHT_BLUE_SHULKER_BOX:
          mode: IGNORE
        MAGENTA_SHULKER_BOX:
          mode: IGNORE
        ORANGE_SHULKER_BOX:
          mode: IGNORE
        WHITE_SHULKER_BOX:
          mode: IGNORE
    post:
      set-fire: true
      fire-chance: 0.85
      commands: []
    knockback:
      enabled: true
      living-multiplier: 1.2
      tnt-enabled: false
      tnt-multiplier: 1.0
      max-velocity: 2.5