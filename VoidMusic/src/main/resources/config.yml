# VoidMusic: музыка для игроков в мире спавна.
# Пока игрок находится в указанном мире, ему играет трек;
# при выходе из мира звук глушится, при входе — запускается заново.

# Имя мира (спавн). Например: world, world_nether, spawn и т.д.
world: world

# Имя звука. Менять только вместе с VoidMusicPack.mcpack.
sound: 'voidpe:spawn_music'

# Громкость (0.0-1.0) и питч.
volume: 1.0
pitch: 1.0

# Через сколько секунд трек запускается заново.
# Длительность трека в паке = 220 секунд (3:40).
loop-seconds: 220
