name: VoidMusic
version: '1.1.0'
main: ru.voidpe.music.VoidMusic
api-version: '1.20'
author: VoidPE
description: Музыка для игроков в мире спавна (world). Трек из VoidMusicPack.mcpack.
commands:
  vmusic:
    description: 'Музыка спавна: start/stop/status/reload'
    usage: '/vmusic [start [игрок]|stop [игрок]|status|reload]'
    aliases: [voidmusic]
permissions:
  voidmusic.admin:
    description: 'Старт музыки, стоп для других игроков, status, reload'
    default: op
  voidmusic.stop:
    description: 'Прекратить музыку для себя'
    default: true
