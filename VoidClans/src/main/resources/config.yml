# ============================================================
#  VoidClans — кланы (VoidPE, Bedrock)
#
#  /clan — меню клана. Деньги клана — монеты Vault.
#  Роли и их права настраиваются прямо в игре: меню клана ->
#  "Роли и права" или /clan setperm <роль> <право>.
#  Права: invite (приглашать), kick (кикать), withdraw (снимать
#  монеты из банка), promote (выдавать роли ниже своей),
#  settings (настраивать права ролей), sethome (ставить дом).
#  У Лидера всегда все права. Данные: plugins/VoidClans/clans.yml
# ============================================================

settings:
  create-cost: 10000        # цена создания клана (монеты Vault), 0 — бесплатно
  max-members: 20           # максимум игроков в клане
  name-min: 3
  name-max: 16
  invite-expire-seconds: 120

# Роли: priority — чем выше, тем главнее (кикать/менять роли можно
# только игрокам с приоритетом ниже своего). permissions — права
# по умолчанию для НОВЫХ кланов; дальше каждый клан настраивает сам.
roles:
  leader:
    name: "&#FFD93DЛидер"
    priority: 100
    permissions: [invite, kick, withdraw, promote, settings, sethome]
  deputy:
    name: "&#FF9A3DЗаместитель"
    priority: 80
    permissions: [invite, kick, withdraw, promote, sethome]
  officer:
    name: "&#8CE8FFОфицер"
    priority: 50
    permissions: [invite]
  member:
    name: "&7Боец"
    priority: 10
    permissions: []
default-role: member        # роль новых участников

menu:
  title: "&#C86BFFКлан"
  title-none: "&#C86BFFКланы"
  amounts: [100, 1000, 10000]   # кнопки сумм в банке (последняя — "всё")

