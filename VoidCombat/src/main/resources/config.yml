# ============================================================
#  VoidCombat — режим боя сервера VoidPE (Bedrock)
#
#  Игрок входит в режим боя, когда наносит или получает PvP-урон.
#  Пока режим боя активен:
#   - золотые яблоки, зелья исцеления и кастомные предметы
#     используются с кулдаунами ниже;
#   - фейерверки запрещены полностью (и для элитр, и в арбалете).
#
#  Цвета: &a, &#FFB340 и <gradient:#FF5555:#FFB340>текст</gradient>
# ============================================================

combat:
  enabled: true
  # Сколько секунд держится режим боя после последнего PvP-урона.
  duration-seconds: 15
  # Не ставить метку боя, если участник в креативе или наблюдателе.
  ignore-creative-and-spectator: true
  display:
    # Показывать оставшееся время над хотбаром каждую секунду.
    actionbar: true
    # Текст в actionbar: {seconds} — осталось секунд.
    actionbar-format: "&#FF5555Режим боя: &f{seconds} сек."

cooldowns:
  enabled: true
  # true — кулдауны работают только пока игрок в режиме боя.
  # false — кулдауны ниже действуют всегда.
  only-in-combat: true

  # Обычные предметы (секунды).
  vanilla:
    golden-apple: 30
    enchanted-golden-apple: 180
    # Питьевые, взрывные и оседающие зелья исцеления.
    healing-potion: 15

  # Предметы VoidItems (узнаются по скрытой метке плагина).
  custom-items:
    enabled: true
    # Кастомный предмет нельзя поставить на кулдаун меньше этого значения,
    # если его кулдаун больше нуля.
    minimum-seconds: 60
    # Кулдаун, если для конкретного id ниже ничего не указано.
    default-seconds: 60
    items:
      trapka: 60
      dust: 60
      dezorientation: 60
      spawner_lom: 60
      pot_berserk: 60
      pot_warrior: 60
      pot_runner: 60
      pot_tank: 60
    # Активные предметы: плагин замечает успешное использование и только
    # тогда включает кулдаун. Кастомные зелья VoidItems включаются сюда
    # автоматически при питье, даже если их id нет в списке.
    tracked-ids:
      - trapka
      - dust
      - dezorientation
      - spawner_lom

fireworks:
  # Запрещать фейерверки всеми способами, пока игрок в режиме боя:
  # запуск рукой, ускорение на элитрах и выстрел из арбалета.
  block-in-combat: true

messages:
  prefix: "&#FF5555VoidPE &8» &f"
  combat-started: "&cВы вошли в режим боя! &7Противник: &f{player}"
  combat-started-by: "&cВы вошли в режим боя! &7Противник: &f{player}"
  combat-ended: "&aРежим боя окончен."
  combat-status-active: "&cВы в режиме боя, осталось: &f{seconds} сек."
  combat-status-none: "&aВы не в режиме боя."
  cooldown: "&c{item} &cбудет доступно через &f{seconds} сек."
  firework-blocked: "&cФейерверки запрещены в режиме боя."
  no-permission: "&cТолько для админов."
  reloaded: "&aVoidCombat перезагружен."
  help:
    - "&fРежим боя VoidPE:"
    - "&7/combat &8— проверить, активен ли режим боя"
    - "&7/combat reload &8— перезагрузка (админ)"

# Названия обычных предметов в сообщении о кулдауне.
item-names:
  golden-apple: "Золотое яблоко"
  enchanted-golden-apple: "Зачарованное золотое яблоко"
  healing-potion: "Зелье исцеления"
